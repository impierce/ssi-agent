[package]
name = "agent_event_publisher_nats"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
agent_shared = { path = "../agent_shared" }
shared-kernel.workspace = true

async-nats = "0.42"
serde_json.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tracing.workspace = true

[dev-dependencies]
agent_shared = { path = "../agent_shared", features = ["test_utils"] }

futures.workspace = true
testcontainers-modules = { version = "0.15", features = ["nats"] }

[features]
# Enables the integration tests that start a NATS server in a Docker container.
docker-tests = []

[[test]]
name = "nats"
required-features = ["docker-tests"]
