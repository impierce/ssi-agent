log_format: "text"
event_store:
  type: "in_memory"
url: "https://my-domain.example.org"

did_methods:
  did_jwk:
    enabled: true
    # preferred: true
  did_key:
    enabled: true
    preferred: true
  did_web:
    enabled: false

domain_linkage_enabled: false

signing_algorithms_supported:
  eddsa:
    preferred: true
    enabled: true

vp_formats:
  jwt_vc_json:
    enabled: true
  jwt_vp_json:
    enabled: true

event_publishers:
  http:
    enabled: false
    target_url: "http://localhost"
    headers:
      Authorization: Basic YWxhZGRpbjpvcGVuc2VzYW1l
    events:
      server_config: []
      credential: [UnsignedCredentialCreated, CredentialSigned]

display:
  - name: UniCore
    locale: en
    logo:
      uri: "https://impierce.com/images/favicon/apple-touch-icon.png"
      alt_text: UniCore Logo

credential_configurations:
  - credential_configuration_id: badge
    format: jwt_vc_json
    credential_definition:
      type:
        - VerifiableCredential
    display:
      - name: Verifiable Credential
        locale: en
        logo:
          uri: https://impierce.com/images/logo-blue.png
          alt_text: UniCore Logo

secret_manager:
  stronghold_path: "../agent_secret_manager/tests/res/test.stronghold.dat"
  stronghold_password: "VNvRtH4tKyWwvJDpL6Vuc2aoLiKAecGQ"
  issuer_eddsa_key_id: "UVDxWhG2rB39FkaR7I27mHeUNrGtUgcr"
