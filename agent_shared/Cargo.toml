[package]
name = "agent_shared"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
agent_macros = { path = "../agent_macros" }
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
config = { version = "0.14" }
cqrs-es.workspace = true
derive_more = { version = "2.0", features = ["full"] }
dotenvy = { version = "0.15" }
http-serde = "2.1"
# TODO: replace all identity_* with identity_iota?
identity_iota.workspace = true
jsonwebtoken.workspace = true
oid4vc-core.workspace = true
oid4vci.workspace = true
oid4vp.workspace = true
once_cell.workspace = true
paste = "1.0"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
serde_with = "3.0"
serde_yaml.workspace = true
strum = { version = "0.26", features = ["derive"] }
thiserror.workspace = true
time = { version = "0.3" }
tracing.workspace = true
url.workspace = true

[dev-dependencies]
agent_shared = { path = ".", features = ["test_utils"] }
serial_test = "3.0"
temp-env = "0.3"

[features]
local_development = []
test_utils = []
