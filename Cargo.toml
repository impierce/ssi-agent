[workspace]
resolver = "2"
members = [
    "agent_api_rest",
    "agent_application",
    "agent_event_publisher_http",
    "agent_holder",
    "agent_identity",
    "agent_issuance",
    "agent_macros",
    "agent_secret_manager",
    "agent_shared",
    "agent_store",
    "agent_verification",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.76.0"

[workspace.dependencies]
siopv2 = { git = "https://git@github.com/impierce/openid4vc.git", rev = "9fcd21b" }
oid4vci = { git = "https://git@github.com/impierce/openid4vc.git", rev = "9fcd21b" }
oid4vc-core = { git = "https://git@github.com/impierce/openid4vc.git", rev = "9fcd21b" }
oid4vc-manager = { git = "https://git@github.com/impierce/openid4vc.git", rev = "9fcd21b" }
oid4vp = { git = "https://git@github.com/impierce/openid4vc.git", rev = "9fcd21b" }

anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.8" }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
cqrs-es = "0.4.12"
derivative = "2.2"
futures = "0.3"
identity_core = "1.5"
identity_credential = { version = "1.5", default-features = false, features = [
    "validator",
    "credential",
    "presentation",
    "domain-linkage",
] }
identity_did = { version = "1.5" }
identity_document = { version = "1.5" }
identity_iota = { version = "1.5" }
identity_verification = { version = "1.5", default-features = false }
iota-sdk = { version = "1.0", default-features = false, features = [
    "tls",
    "client",
    "stronghold",
] }
jsonwebtoken = "9.3"
lazy_static = "1.4"
mime = { version = "0.3" }
once_cell = { version = "1.19" }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
rstest = "0.22"
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0" }
serde_json_path_to_error = { version = "0.1" }
serde_with = "3.7"
serde_yaml = "0.9"
strum = "0.26"
strum_macros = "0.26"
temp-env = "0.3"
thiserror = "1.0"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.4" }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-test = { version = "0.2" }
url = "2.5"
uuid = { version = "1.4", features = ["v4", "fast-rng", "serde"] }
wiremock = "0.6"


