[workspace]
resolver = "2"
members = [
    "agent_api_http",
    "agent_application",
    "agent_authorization",
    "agent_event_publisher_http",
    "agent_event_publisher_nats",
    "agent_holder",
    "agent_identity",
    "agent_issuance",
    "agent_library",
    "agent_macros",
    "agent_secret_manager",
    "agent_shared",
    "agent_store",
    "agent_verification",

    "shared-kernel",

    "infrastructure/stores/mongodb",
    "infrastructure/adapters/verification-authorization",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95.0"
license-file = "LICENSE"
publish = false

[workspace.lints.clippy]
# Enables a large group of strict lints for idiomatic Rust.
# Note: This includes opinionated rules that can be overly strict. We may selectively disable specific lints if they
# prove too noisy.
pedantic = "warn"

[workspace.dependencies]
oid4vc-core = "0.3"
oid4vc-manager = "0.3"
oid4vci = { version = "0.3", features = ["utoipa"] }
oid4vp = "0.3"
siopv2 = "0.3"

identity-kit = { version = "0.3", default-features = false, features = [
    "did-jwk",
    "did-key",
    "did-web",
    "domain-linkage",
    "linked-vp",
    "reqwest",
    "sd-jwt",
    "utoipa",
] }

shared-kernel = { path = "shared-kernel" }

anyhow = "1.0"
async-std = { version = "1.5", features = ["attributes", "tokio1"] }
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
cqrs-es = "0.5.0"
derivative = "2.2"
flate2 = "1.1"
futures = "0.3"
hickory-resolver = "0.26"
mockall = "0.14"
identity_core = { git = "https://github.com/iotaledger/identity", tag = "v1.9.6-beta.1" }
identity_credential = { git = "https://github.com/iotaledger/identity", tag = "v1.9.6-beta.1", default-features = false, features = [
    "domain-linkage",
    "presentation",
] }
identity_did = { git = "https://github.com/iotaledger/identity", tag = "v1.9.6-beta.1" }
identity_document = { git = "https://github.com/iotaledger/identity", tag = "v1.9.6-beta.1" }
identity_iota = { git = "https://github.com/iotaledger/identity", tag = "v1.9.6-beta.1" }
identity_storage = { git = "https://github.com/iotaledger/identity", tag = "v1.9.6-beta.1" }
identity_verification = { git = "https://github.com/iotaledger/identity", tag = "v1.9.6-beta.1", default-features = false }
iota-sdk = { git = "https://github.com/iotaledger/iota", package = "iota-sdk", rev = "96196f0da231883ec69cda04892c600ef6afa982" }
# TODO: Check if this is still needed.
iota-sdk-legacy = { version = "1.0", package = "iota-sdk", default-features = false, features = [
    "tls",
    "client",
    "stronghold",
] }
iso8601 = "0.6"
indexmap = { version = "2.14", features = ["serde"] }
jsonschema = "0.46"
jsonwebtoken = { version = "11.1", default-features = false, features = ["rust_crypto"] }
lazy_static = "1.4"
mime = { version = "0.3" }
mongo-es = "0.4.1"
once_cell = { version = "1.19" }
opentelemetry = "0.31"
product_common = { git = "https://github.com/iotaledger/product-core", tag = "v0.8.16", package = "product_common", features = [
    "gas-station",
    "default-http-client",
] }
percent-encoding = "2.3"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
rstest = "0.22"
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0" }
serde_json_path_to_error = { version = "0.1" }
serde_norway = "0.9"
serde_urlencoded = "0.7"
serde_with = "3.13"
strum = "0.26"
strum_macros = "0.26"
temp-env = "0.3"
thiserror = "1.0"
tokio = { version = "1.46", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower = { version = "0.4" }
tower-http = { version = "0.6", features = ["compression-gzip", "cors", "trace"] }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-test = { version = "0.2" }
url = "2.5"
utoipa = { version = "6", features = ["axum_extras", "chrono", "url", "yaml"] }
uuid = { version = "1.4", features = ["v4", "fast-rng", "serde"] }
wiremock = "0.6"
