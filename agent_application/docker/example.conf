server {
    listen 80;
    server_name localhost;

    location /custom/path/token {
        proxy_pass http://ssi-agent:3033/auth/token;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /another/custom/path/credential {
        proxy_pass http://ssi-agent:3033/openid4vci/credential;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Default catch-all that forwards to the same endpoint path on the container
    location / {
        proxy_pass http://ssi-agent:3033;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
