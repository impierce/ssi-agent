# Application
log_format: "text"
event_store:
  type: "postgres"
  # connection_string: "" <== Should be injected through the env variable `UNICORE__EVENT_STORE__CONNECTION_STRING`
application_url: "https://ssi-agent.example.org"

did_methods:
  did_jwk:
    enabled: true
    preferred: true
  did_key:
    enabled: true
  did_web:
    enabled: false

enable_interactive_authorization_flow: true

signing_algorithms_supported:
  es256:
    enabled: true
    preferred: true
  eddsa:
    enabled: false

# agent_event_publisher_http
# Configure here which integration events will be dispatched to a specific `target_url`. In the example below, the
# HTTP forwarder listens for issuance events matching the pattern. The CloudEvents will be dispatched to the target endpoint.
event_publishers:
  http:
    - enabled: false
      target_url: "https://my-domain.example.org/event-subscriber"
      headers:
        Authorization: Basic YWxhZGRpbjpvcGVuc2VzYW1l
      events:
        types:
          - "com.impierce.unicore.issuance.credential.offered"
          - "com.impierce.unicore.issuance.credential.issued"
        # To enable the interactive authorization flow for OID4VCI, the event below needs to be listened to.
        # types:
        #   - "com.impierce.unicore.verification.presentation.verified"
  nats:
    enabled: true
    nats_url: "nats://localhost:4222"
    subjects:
      - name: "email.commands"
        events:
          types:
            - "com.impierce.unicore.issuance.offer.tx_code_generated"
            - "com.impierce.unicore.issuance.offer.email_sent"

# These display parameters are interpreted by identity wallets.
display:
  # This value will also be used in the SIOPv2/OID4VP `client_metadata`'s `client_name` property.
  - name: UniCore
    locale: en
    logo:
      # This value will also be used in the SIOPv2/OID4VP `client_metadata`'s `logo_uri` property.
      uri: "https://www.impierce.com/external/impierce-icon.png"
      alt_text: UniCore Logo

serve_openapi_enabled: false

# File-based key management
secret_manager:
  stronghold_path: "/tmp/local.stronghold.dat"
  # stronghold_password: "" <== Should be injected through the env variable `UNICORE__SECRET_MANAGER__STRONGHOLD_PASSWORD`
