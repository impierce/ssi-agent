# Property-based fuzzing of the HTTP API against its own generated OpenAPI specification.
#
# Deliberately not part of `Format, Lint, Test`: property-based testing explores a different set of
# inputs on every run, so a failure here is a finding to triage rather than a verdict on the commit
# that happens to trigger it. Runs on a schedule and on demand.
name: Fuzz OpenAPI

on:
  workflow_dispatch:
    inputs:
      spec:
        description: "Specification to fuzz: the published API, or the full API including the standardized protocol endpoints"
        required: false
        type: choice
        options:
          - published
          - full
        default: published
      command:
        description: "`run`: every test phase once per operation; `fuzz`: multi-step operation sequences until `max_time`"
        required: false
        type: choice
        options:
          - run
          - fuzz
        default: run
      max_examples:
        description: "Test cases generated per API operation (`run` only)"
        required: false
        default: "50"
      max_time:
        description: "Time budget in seconds (optional for `run`, required for `fuzz`)"
        required: false
        default: ""
      seed:
        description: "Random seed, to reproduce an earlier run (optional)"
        required: false
        default: ""
      extra_args:
        description: "Additional Schemathesis flags, e.g. --include-path /v0/credentials"
        required: false
        default: ""
  schedule:
    # 03:17 UTC daily. Off the hour, to avoid the GitHub-wide scheduling spike.
    - cron: "17 3 * * *"

permissions:
  contents: read # for checkout

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-latest
    # The agent image is built from source; a `max_time` of up to two hours still fits.
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Fuzz
        env:
          FUZZ_SPEC: ${{ inputs.spec || 'published' }}
          FUZZ_COMMAND: ${{ inputs.command || 'run' }}
          FUZZ_MAX_EXAMPLES: ${{ inputs.max_examples || '50' }}
          FUZZ_MAX_TIME: ${{ inputs.max_time }}
          FUZZ_SEED: ${{ inputs.seed }}
          FUZZ_EXTRA_ARGS: ${{ inputs.extra_args }}
        run: ./scripts/fuzz-openapi.sh

      - name: Summarize
        if: always()
        run: |
          report="reports/fuzz/junit.xml"
          if [ ! -f "$report" ]; then
            echo "No JUnit report was produced — the run failed before fuzzing started." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 scripts/fuzz-summary.py "$report" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-reports
          path: reports/fuzz/
          if-no-files-found: warn
          retention-days: 14
