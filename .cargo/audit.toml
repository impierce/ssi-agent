[advisories]
ignore = [
    # RUSTSEC-2023-0071: rsa v0.9.10 — Marvin Attack (RSA timing side-channel)
    # No patched version of the rsa crate is available. It is a transitive dependency of:
    #   - stronghold_ext: backs `RS256` keys in agent_secret_manager's `StrongholdKeyStore`.
    #     Used for RSASSA-PKCS1-v1_5 signing only, never for decryption, which is the primary
    #     Marvin Attack vector.
    #   - jsonwebtoken (`rust_crypto` feature): used to verify RS256 signatures, a public-key
    #     operation that does not involve a private key.
    # TODO: revisit when a patched version of the rsa crate is published and adopted upstream.
    "RUSTSEC-2023-0071",
]
