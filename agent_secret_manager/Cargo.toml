[package]
name = "agent_secret_manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
agent_shared = { path = "../agent_shared" }

stronghold_ext = { git = "https://github.com/impierce/stronghold_ext.git", rev = "64f2f52", default-features = false, features = [
    "es256",
    "rs256",
] }

anyhow.workspace = true
async-trait.workspace = true
futures.workspace = true
identity-kit.workspace = true
identity_iota.workspace = true
iota_stronghold = { version = "2.1" }
jsonwebtoken.workspace = true
log = "0.4"
oid4vc-core.workspace = true
rustls = { version = "0.23", default-features = false, features = [
    "logging",
    "std",
    "tls12",
] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
agent_secret_manager = { path = ".", features = ["test_utils"] }
agent_shared = { path = "../agent_shared", features = ["test_utils"] }

base64.workspace = true
futures.workspace = true
identity-kit = { workspace = true, features = ["test-vectors"] }
lazy_static.workspace = true
ring = "0.17.8"
rstest.workspace = true
wiremock.workspace = true

[features]
test_utils = ["identity-kit/local-network"]
allow-localhost = ["identity-kit/local-network"]
