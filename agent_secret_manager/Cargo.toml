[package]
name = "agent_secret_manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
agent_shared = { path = "../agent_shared" }

# TODO: Fully remove `did_manager`.
# - The `producer` module has already been eliminated.
# - In the `consumer` module, only the `Resolver` struct is still in use.
# - All components of the `identity_stronghold_ext` module are still active.
#
# Future work: Migrate the remaining functionality into UniCore.
did_manager_consumer = { git = "https://github.com/impierce/did-manager", rev = "9d17d57", package = "consumer" }
did_manager_identity_stronghold_ext = { git = "https://github.com/impierce/did-manager", rev = "9d17d57", package = "identity_stronghold_ext" }
did_manager_iota = { git = "https://github.com/impierce/did-manager", rev = "9d17d57", package = "did_iota" }

anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
futures.workspace = true
identity_iota.workspace = true
iota-sdk.workspace = true
iota-sdk-legacy.workspace = true
iota_stronghold = { version = "2.1" }
itertools = "0.14"
jsonwebtoken = "9.3"
log = "0.4"
oid4vc-core.workspace = true
p256 = { version = "0.13", features = ["jwk"] }
rustls = { version = "0.23", default-features = false, features = [
    "logging",
    "std",
    "tls12",
] }
sd-jwt.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
url.workspace = true

[dev-dependencies]
agent_secret_manager = { path = ".", features = ["test_utils"] }
agent_shared = { path = "../agent_shared", features = ["test_utils"] }

futures.workspace = true
lazy_static.workspace = true
ring = "0.17.8"

[features]
test_utils = []
