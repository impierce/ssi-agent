      properties:
        nonRemovable:
          type: boolean
          description: |-
            Whether this property is non-removable — its leaf field must remain present in the schema
            and cannot be removed by the caller. Determined by the data model; system-controlled only.
            For OpenBadges 3.0 templates, only the required standard fields are non-removable.
            Defaults to `false`.
        selectivelyDisclosable:
          type: boolean
        type:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/FormFieldType'
            description: |-
              Allows the caller to store additional type information not supported by standard JSON Schema keywords.
              This can be used by frontends to preserve field type information for visualizations.
              Purely a rendering hint that UniCore stores as given and never validates against the
              schema or the issued values.
