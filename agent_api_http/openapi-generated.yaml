            properties:
              event:
                type: string
                enum:
                - credential_accepted
                - credential_failure
                - credential_deleted
              event_description:
                type: string
              notification_id:
                type: string
          description: this is notification request
        id:
          type: string
        notification_id:
          type:
          - string
          - 'null'
        signed: {}
        status:
          type: string
          enum:
          - Pending
          - Issued
