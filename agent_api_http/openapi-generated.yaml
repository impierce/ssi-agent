openapi: 3.1.0
info:
  title: UniCore HTTP API
  description: ''
  license:
    name: Apache 2.0
  version: 0.0.0-semantically-released
servers:
- url: http://localhost:3033
  description: Local development
paths:
  /v0/connections:
    get:
      tags:
      - Connections
      summary: List all connections
      description: List all available connections.
      operationId: get_all_connections
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GetConnectionsEndpointRequest'
        required: true
      responses:
        '200':
          description: All connections retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Connection'
    post:
      tags:
      - Connections
      summary: Add a Connection
      description: Adds a new connection based on the provided url.
      operationId: add_connection
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddConnectionEndpointRequest'
        required: true
      responses:
        '201':
          description: Connection added successfully
          headers:
            Location:
              schema:
                type: string
              description: URI of the newly created connection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
  /v0/connections/accept-pending-changes:
    post:
      tags:
      - Connections
      summary: Accept Pending Changes
      description: Accept pending changes to a connection.
      operationId: accept_connection_changes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptConnectionChangesRequest'
        required: true
      responses:
        '200':
          description: ''
  /v0/connections/remove-connection:
    post:
      tags:
      - Connections
      summary: Remove Connection
      description: Removes a connection by its ID.
      operationId: remove_connection
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveConnectionRequest'
        required: true
      responses:
        '200':
          description: ''
  /v0/connections/sync-connection:
    post:
      tags:
      - Connections
      summary: Sync connection by ID
      description: Sync the latest version of a connection by its unique identifier.
      operationId: sync_connection_by_id
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncConnectionRequest'
        required: true
      responses:
        '200':
          description: ''
  /v0/connections/{id}:
    get:
      tags:
      - Connections
      summary: Get connection by ID
      description: Retrieve a specific connection by its unique identifier.
      operationId: get_connection_by_id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Connection retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
  /v0/credentials:
    get:
      tags:
      - Issuance
      summary: List all credentials
      description: Lists all credentials including their current status and metadata.
      operationId: get_all_credentials
      responses:
        '200':
          description: List of all credentials
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Credential'
    post:
      tags:
      - Credentials
      - Issuance
      summary: Create a credential
      description: Creates a verifiable credential based on the provided template and data. An offer is created for the provided offer ID.
      operationId: create_credential
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialsEndpointRequest'
        required: true
      responses:
        '201':
          description: Credential created successfully
          headers:
            Location:
              schema:
                type: string
              description: URI of the newly created credential
  /v0/credentials/{credential_id}:
    get:
      tags:
      - Issuance
      summary: Get credential by ID
      description: Retrieves a credential by its ID.
      operationId: get_credential_by_id
      parameters:
      - name: credential_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successfully retrieved credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credential'
  /v0/documents:
    get:
      tags:
      - Identity
      summary: List DID documents
      description: Retrieves the list of DID documents in use by your organisation.
      operationId: get_all_documents
      parameters:
      - name: did_method
        in: query
        required: false
        schema:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/SupportedDidMethod'
      responses:
        '200':
          description: Documents retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Document'
  /v0/documents/{document_id}:
    get:
      tags:
      - Identity
      summary: Get DID document by ID
      description: Retrieves a DID document of your organisation by its ID.
      operationId: get_document_by_id
      parameters:
      - name: document_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Document retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '404':
          description: Document not found
  /v0/holder/credentials:
    get:
      tags:
      - Identity
      - Holder
      summary: List all credentials
      description: Retrieves all credentials held by your organisation.
      operationId: get_all_holder_credentials
      responses:
        '200':
          description: All credentials retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CredentialView'
  /v0/holder/credentials/{holder_credential_id}:
    get:
      tags:
      - Identity
      - Holder
      summary: Get credential by ID
      description: Retrieves a credential held by your organisation by its ID.
      operationId: get_holder_credential_by_id
      parameters:
      - name: holder_credential_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Credential retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialView'
        '404':
          description: Credential not found
  /v0/holder/offers:
    get:
      tags:
      - Identity
      - Holder
      summary: List all offers
      description: Retrieves all offers received by your organisation.
      operationId: get_all_holder_credential_offers
      responses:
        '200':
          description: All offers retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OfferView'
  /v0/holder/offers/{offer_id}/accept:
    post:
      tags:
      - Identity
      - Holder
      summary: Accept a credential offer
      description: Accepts a credential offered to your organization by its ID.
      operationId: accept_credential_offer
      parameters:
      - name: offer_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Credential offer accepted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferView'
        '404':
          description: Credential offer not found
  /v0/holder/offers/{offer_id}/reject:
    post:
      tags:
      - Identity
      - Holder
      summary: Rejects a credential offer
      description: Rejects a credential offered to your organization by its ID.
      operationId: reject_credential_offer
      parameters:
      - name: offer_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Credential offer rejected successfully
  /v0/holder/offers/{received_offer_id}:
    get:
      tags:
      - Identity
      - Holder
      summary: Get offer by ID
      description: Retrieves an offer received by your organisation by its ID.
      operationId: get_holder_offer_by_id
      parameters:
      - name: received_offer_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Offer retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferView'
        '404':
          description: Offer not found
  /v0/offers:
    get:
      tags:
      - Issuance
      summary: Get all offers
      description: List all credential offers.
      operationId: get_all_offers
      responses:
        '200':
          description: All offers retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Offer'
  /v0/offers/send-offer-to-individual:
    post:
      tags:
      - Issuance
      summary: Send offer to individual
      description: Sends a credential offer to an individual's email.
      operationId: send_offer_to_individual
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailOfferEndpointRequest'
        required: true
      responses:
        '200':
          description: Offer sent successfully
  /v0/offers/send-offer-to-organization:
    post:
      tags:
      - Issuance
      summary: Send offer to organization
      description: Sends a credential offer to an organization's URL.
      operationId: send_offer_to_organization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TargetUrlOfferEndpointRequest'
        required: true
      responses:
        '200':
          description: Offer sent successfully
  /v0/offers/{offer_id}:
    get:
      tags:
      - Issuance
      summary: Get offer by ID
      description: Retrieves a credential offer by its ID.
      operationId: get_offer_by_id
      parameters:
      - name: offer_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Offer retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
        '404':
          description: Offer not found
  /v0/profile:
    get:
      tags:
      - Identity
      - Profile
      summary: Get organisation profile
      description: Retrieves the profile information of your organisation.
      operationId: get_profile
      responses:
        '200':
          description: Profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '404':
          description: Profile not found
    patch:
      tags:
      - Identity
      - Profile
      summary: Update organisation profile
      description: Updates your organisation's profile with the given information.
      operationId: update_profile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchProfileEndpointRequest'
        required: true
      responses:
        '200':
          description: Profile updated successfully
  /v0/templates/create-template:
    post:
      tags:
      - Library
      - Templates
      summary: Create a new template
      description: |-
        Creates a new template which can be used to issue credentials.
        The request body uses a discriminated union based on `dataModel`:
        - For `open_badges_3-0`: the schema must include the required properties
          (`achievement.name`, `achievement.description`, `achievement.criteria.narrative`). A validation error is
          returned if they are missing.
        - For all other data models: no default schema requirements are enforced.
      operationId: create_template
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTemplateRequestBody'
            examples:
              OpenBadges template:
                description: An OpenBadges 3.0 template. The fields `achievement.name`, `achievement.description`, and `achievement.criteria.narrative` must be explicitly included in the schema.
                value:
                  title: OpenBadges template
                  dataModel: open_badges_3-0
                  holderType: individual
                  schema:
                    type: object
                    properties:
                      achievement.name:
                        type: string
                      achievement.description:
                        type: string
                      achievement.criteria.narrative:
                        type: string
              Standard template:
                description: A simple example that will issue credentials in the W3C Verifiable Credentials Data Model v1.1 format.
                value:
                  title: Standard template
                  dataModel: w3c_vc_data_model_v1-1
                  holderType: individual
        required: true
      responses:
        '201':
          description: New template created successfully
          headers:
            Location:
              schema:
                type: string
              description: The path of the newly created template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
  /v0/templates/delete-template:
    post:
      tags:
      - Library
      - Templates
      summary: Delete a template
      description: Deletes a template by marking its status as `Deleted`. Deleted templates will no longer appear in any views.
      operationId: delete_template_by_id
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteTemplateEndpointRequest'
        required: true
      responses:
        '204':
          description: Template deleted successfully
  /v0/templates/duplicate-template:
    post:
      tags:
      - Library
      - Templates
      summary: Duplicate existing template
      description: Creates a duplicate of an existing template.
      operationId: duplicate_template
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DuplicateTemplateEndpointRequest'
            example:
              sourceTemplateId: 91fc790f-d876-4827-9a9d-0fb0f6766dca
        required: true
      responses:
        '201':
          description: Duplicate created successfully
          headers:
            Location:
              schema:
                type: string
              description: The path of the newly created template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
        '422':
          description: Source Template Not Found
  /v0/templates/get-all-templates:
    get:
      tags:
      - Library
      - Templates
      summary: List all templates
      description: List all available templates.
      operationId: get_all_templates
      responses:
        '200':
          description: All templates retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Template'
  /v0/templates/update-template:
    post:
      tags:
      - Library
      - Templates
      summary: Update a template
      description: Updates an existing template with the provided content.
      operationId: update_template
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTemplateEndpointRequest'
        required: true
      responses:
        '204':
          description: Template updated successfully
  /v0/templates/{template_id}:
    get:
      tags:
      - Library
      - Templates
      summary: Get template by ID
      description: Retrieve a specific template by its ID.
      operationId: get_template_by_id
      parameters:
      - name: template_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Template retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
components:
  schemas:
    AcceptConnectionChangesRequest:
      type: object
      required:
      - id
      properties:
        id:
          type: string
    AddConnectionEndpointRequest:
      type: object
      required:
      - url
      properties:
        url:
          type: string
    Connection:
      type: object
      required:
      - id
      - url
      - dids
      - validations
      properties:
        dids:
          type: array
          items:
            type: string
        display:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ConnectionDisplayProperties'
        first_interacted_at:
          type:
          - string
          - 'null'
          format: date-time
        id:
          type: string
        last_interacted_at:
          type:
          - string
          - 'null'
          format: date-time
        pending_changes:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/PendingChanges'
        url:
          type: string
          format: uri
        validations:
          type: array
          items:
            $ref: '#/components/schemas/Validation'
    ConnectionDisplayProperties:
      type: object
      properties:
        locale:
          type:
          - string
          - 'null'
        logo:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/LogoProperties'
        name:
          type:
          - string
          - 'null'
    CreateTemplateRequestBody:
      type: object
      properties:
        creator:
          type:
          - string
          - 'null'
          default: null
        dataModel:
          oneOf:
          - $ref: '#/components/schemas/DataModel'
          default: w3c_vc_data_model_v2-0
        description:
          type:
          - string
          - 'null'
          default: null
        display:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Display'
          default: null
        holderType:
          oneOf:
          - $ref: '#/components/schemas/HolderType'
          default: individual
        schema: {}
        schemaPropertiesAttributes:
          type:
          - object
          - 'null'
          default: null
          additionalProperties:
            $ref: '#/components/schemas/PropertyAttribute'
          propertyNames:
            type: string
        status:
          oneOf:
          - $ref: '#/components/schemas/TemplateStatus'
          default: draft
        tags:
          type: array
          items:
            type: string
          default: []
        title:
          type: string
          default: ''
        type:
          type: array
          items:
            type: string
          default: []
        visibility:
          oneOf:
          - $ref: '#/components/schemas/Visibility'
          default: private
    Credential:
      type: object
      required:
      - id
      - credential_configuration
      - status
      - holder_notifications
      - credential_status
      properties:
        created_at:
          type:
          - string
          - 'null'
        credential_configuration:
          type: object
          required:
          - credential_format
          properties:
            credential_format:
              type: object
              enum:
              - jwt_vc_json
              - dc+sd-jwt
              - vc+sd-jwt
            credential_metadata:
              type: object
              properties:
                claims:
                  type: array
                  items: {}
                display:
                  type: array
                  items:
                    type: object
                    required:
                    - name
                    properties:
                      background_color:
                        type: string
                      background_image:
                        type: string
                      description:
                        type: string
                      locale:
                        type: string
                      logo:
                        type: object
                        required:
                        - uri
                        properties:
                          alt_text:
                            type: string
                          uri:
                            type: string
                            format: uri
                      name:
                        type: string
                      text_color:
                        type: string
            credential_signing_alg_values_supported:
              type: array
              items:
                type: string
            cryptographic_binding_methods_supported:
              type: array
              items:
                type: string
            proof_types_supported:
              type: object
            scope:
              type: object
        credential_status:
          $ref: '#/components/schemas/CredentialStatus'
        data:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Data'
        expires_at:
          type:
          - string
          - 'null'
        holder_notifications:
          type: array
          items:
            type: object
            required:
            - notification_id
            - event
            properties:
              event:
                type: string
                enum:
                - credential_accepted
                - credential_failure
                - credential_deleted
              event_description:
                type: string
              notification_id:
                type: string
          description: this is notification request
        id:
          type: string
        notification_id:
          type:
          - string
          - 'null'
        signed: {}
        status:
          $ref: '#/components/schemas/IssuanceStatus'
    CredentialExpiry:
      oneOf:
      - type: string
        format: date-time
      - type: 'null'
        default: null
    CredentialOfferStatus:
      type: string
      enum:
      - Created
      - Pending
      - Issued
    CredentialStatus:
      type: object
      required:
      - index
      - status
      - status_list_url
      properties:
        index:
          type: integer
          minimum: 0
        status:
          type: string
          enum:
          - VALID
          - INVALID
          - SUSPENDED
          - UNDEFINED
        status_list_url:
          type: string
    CredentialView:
      type: object
      required:
      - id
      properties:
        data:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Data'
        id:
          type: string
        received_offer_id:
          type:
          - string
          - 'null'
        signed:
          type:
          - string
          - 'null'
    CredentialsEndpointRequest:
      type: object
      required:
      - templateId
      - offerId
      - credential
      - expiresAt
      properties:
        credential: {}
        expiresAt:
          $ref: '#/components/schemas/CredentialExpiry'
        isSigned:
          type: boolean
        offerId:
          type: string
        templateId:
          type: string
    Data:
      type: object
      required:
      - raw
      properties:
        raw: {}
    DataModel:
      type: string
      enum:
      - w3c_vc_data_model_v1-1
      - w3c_vc_data_model_v2-0
      - open_badges_3-0
      - european_learning_model_v3-3
    DeleteTemplateEndpointRequest:
      type: object
      required:
      - id
      properties:
        id:
          type: string
    DeliveryOptions:
      type: object
      properties:
        recipient_email:
          type:
          - string
          - 'null'
    Display:
      type: object
      required:
      - name
      properties:
        logo:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Logo'
        name:
          type: string
    Document:
      type: object
      required:
      - id
      - status
      properties:
        did_method:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/SupportedDidMethod'
        document:
          type: object
        id:
          type: string
        iota_metadata:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/IotaMetadata'
        status:
          $ref: '#/components/schemas/DocumentStatus'
        with_fixed_algorithm:
          type: string
          enum:
          - ES256
          - EdDSA
    DocumentStatus:
      type: string
      enum:
      - SignAndValidate
      - Disabled
    DomainLinkageValidation:
      type: object
      required:
      - domain
      - result
      properties:
        domain:
          type: string
          format: uri
        result:
          $ref: '#/components/schemas/ValidationResult'
    DuplicateTemplateEndpointRequest:
      type: object
      required:
      - sourceTemplateId
      properties:
        sourceTemplateId:
          type: string
    EmailOfferEndpointRequest:
      type: object
      required:
      - offerId
      - recipientEmail
      properties:
        offerId:
          type: string
        recipientEmail:
          type: string
    GetConnectionsEndpointRequest:
      type: object
      properties:
        did:
          type:
          - string
          - 'null'
        display:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ConnectionDisplayProperties'
        url:
          type:
          - string
          - 'null'
    HolderOfferStatus:
      type: string
      enum:
      - Pending
      - Accepted
      - CredentialsReceived
      - Rejected
    HolderType:
      type: string
      enum:
      - individual
      - organization
    IotaMetadata:
      type: object
      description: Metadata for IOTA-based DID Documents.
      required:
      - wallet_address
      - is_funded
      - balance
      - is_published
      - is_deactivated
      properties:
        balance:
          type: integer
          format: int64
          minimum: 0
        created_at:
          type:
          - string
          - 'null'
        explorer_url:
          type:
          - string
          - 'null'
        is_deactivated:
          type: boolean
        is_funded:
          type: boolean
        is_published:
          type: boolean
        updated_at:
          type:
          - string
          - 'null'
        wallet_address:
          type: string
          example: '0x1234567890'
    IssuanceStatus:
      type: string
      enum:
      - Pending
      - Issued
    LinkedVpValidation:
      type: object
    Logo:
      type: object
      properties:
        alt_text:
          type:
          - string
          - 'null'
        uri:
          type:
          - string
          - 'null'
          format: uri
    LogoProperties:
      type: object
      properties:
        alt_text:
          type:
          - string
          - 'null'
        uri:
          type:
          - string
          - 'null'
          format: uri
    Offer:
      type: object
      required:
      - id
      - grant_types
      - credential_ids
      - pre_authorized_code
      - status
      properties:
        credential_ids:
          type: array
          items:
            type: string
        credential_offer:
          type:
          - object
          - 'null'
        credential_offer_uri:
          type:
          - object
          - 'null'
        credential_response:
          type:
          - object
          - 'null'
        delivery_options:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/DeliveryOptions'
        form_url_encoded_credential_offer:
          type:
          - string
          - 'null'
        grant_types:
          type: array
          items:
            type: string
        id:
          type: string
        offer_link:
          type:
          - string
          - 'null'
          format: uri
        pre_authorized_code:
          type: string
        status:
          $ref: '#/components/schemas/CredentialOfferStatus'
        subject_id:
          type:
          - string
          - 'null'
        tx_code:
          type:
          - string
          - 'null'
    OfferCredential:
      type: object
      required:
      - holder_credential_id
      - credential
      properties:
        credential:
          type: string
        holder_credential_id:
          type: string
    OfferView:
      type: object
      required:
      - id
      - status
      - credentials
      properties:
        credential_configurations:
          type:
          - object
          - 'null'
        credential_offer:
          type:
          - object
          - 'null'
        credentials:
          type: array
          items:
            $ref: '#/components/schemas/OfferCredential'
        id:
          type: string
        status:
          $ref: '#/components/schemas/HolderOfferStatus'
        token_response:
          type:
          - object
          - 'null'
    PatchProfileEndpointRequest:
      type: object
      properties:
        country:
          type:
          - string
          - 'null'
        description:
          type:
          - string
          - 'null'
        displayName:
          type:
          - string
          - 'null'
        logo:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Logo'
    PendingChanges:
      type: object
      required:
      - dids
      properties:
        dids:
          type: array
          items:
            type: string
        display:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ConnectionDisplayProperties'
    Profile:
      type: object
      required:
      - source
      properties:
        country:
          type:
          - string
          - 'null'
        description:
          type:
          - string
          - 'null'
        displayName:
          type:
          - string
          - 'null'
        logo:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Logo'
        source:
          $ref: '#/components/schemas/Source'
    PropertyAttribute:
      type: object
      required:
      - selectivelyDisclosable
      properties:
        immutable:
          type: boolean
          description: |-
            Whether this property is immutable (cannot be removed from the schema).
            Determined by the data model and cannot be altered through any command.
            For OpenBadges 3.0 templates, only the required properties
            (`achievement.name`, `achievement.description`, `achievement.criteria.narrative`) are immutable.
            Defaults to `false`.
        selectivelyDisclosable:
          type: boolean
    RemoveConnectionRequest:
      type: object
      required:
      - id
      properties:
        id:
          type: string
    Source:
      type: string
      enum:
      - Provisioned
      - Default
      - Runtime
      - None
    SupportedDidMethod:
      type: string
      description: DID methods supported by UniCore
      enum:
      - did_jwk
      - did_key
      - did_web
      - did_iota
      - did_iota_dev
      - did_iota_test
    SyncConnectionRequest:
      type: object
      required:
      - id
      properties:
        id:
          type: string
    TargetUrlOfferEndpointRequest:
      type: object
      required:
      - offerId
      - targetUrl
      properties:
        offerId:
          type: string
        targetUrl:
          type: string
          format: uri
    Template:
      type: object
      description: Data transfer object for Templates.
      required:
      - id
      - tags
      - status
      - visibility
      - type
      properties:
        creator:
          type:
          - string
          - 'null'
        dataModel:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/DataModel'
        description:
          type:
          - string
          - 'null'
        display:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Display'
        holderType:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/HolderType'
        id:
          type: string
        modifiedAt:
          type:
          - string
          - 'null'
        schema: {}
        schemaPropertiesAttributes:
          type:
          - object
          - 'null'
          additionalProperties:
            $ref: '#/components/schemas/PropertyAttribute'
          propertyNames:
            type: string
        sourceTemplateId:
          type:
          - string
          - 'null'
        status:
          $ref: '#/components/schemas/TemplateStatus'
        tags:
          type: array
          items:
            type: string
        title:
          type:
          - string
          - 'null'
        type:
          type: array
          items:
            type: string
        visibility:
          $ref: '#/components/schemas/Visibility'
    TemplateStatus:
      type: string
      enum:
      - draft
      - published
      - archived
      - deleted
    UpdateTemplateEndpointRequest:
      type: object
      properties:
        creator:
          type:
          - string
          - 'null'
          default: null
        description:
          type:
          - string
          - 'null'
          default: null
        display:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Display'
          default: null
        id:
          type: string
          default: ''
        schema: {}
        schemaPropertiesAttributes:
          type:
          - object
          - 'null'
          default: null
          additionalProperties:
            $ref: '#/components/schemas/PropertyAttribute'
          propertyNames:
            type: string
        status:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/TemplateStatus'
          default: null
        tags:
          type: array
          items:
            type: string
          default: []
        title:
          type: string
          default: ''
        type:
          type: array
          items:
            type: string
          default: []
        visibility:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Visibility'
          default: null
    Validation:
      oneOf:
      - type: object
        required:
        - DomainLinkage
        properties:
          DomainLinkage:
            $ref: '#/components/schemas/DomainLinkageValidation'
      - type: object
        required:
        - LinkedVp
        properties:
          LinkedVp:
            $ref: '#/components/schemas/LinkedVpValidation'
    ValidationResult:
      type: object
      required:
      - valid
      - last_validated_at
      properties:
        error:
          type:
          - string
          - 'null'
        last_validated_at:
          type: string
          format: date-time
        valid:
          type: boolean
    Visibility:
      type: string
      enum:
      - private
      - public
tags:
- name: Identity
  description: Manage all aspects of your organisational identity.
- name: Holder
  description: Manage the credentials your organisation holds itself.
- name: Connections
  description: Manage trusted connections.
- name: Profile
  description: Manage your organisational profile.
- name: Credentials
  description: Create and revoke verifiable credentials.
- name: Issuance
  description: Issue credentials to individuals and organizations, manage credential offers and track their status.
- name: Library
  description: Manage your own templates, browse and import external templates.
- name: Templates
  description: Create and manage templates which provide the structure for credentials to be issued.
externalDocs:
  url: https://docs.impierce.com/unicore
  description: Official UniCore documentation
