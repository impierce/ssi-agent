openapi: 3.1.0
info:
  title: UniCore HTTP API
  description: ''
  license:
    name: Apache 2.0
  version: 0.0.0-semantically-released
servers:
- url: http://localhost:3033
  description: Local development
paths:
  /v0/add-templates-to-catalog:
    post:
      tags:
      - Library
      - Catalog
      summary: Add one or more templates to a catalog
      description: Adds one or more templates to a catalog by their IDs.
      operationId: add_templates_to_catalog
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddTemplatesRequest'
        required: true
      responses:
        '200':
          description: Catalog updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Catalog'
  /v0/change-catalog-appearance:
    post:
      tags:
      - Library
      - Catalog
      summary: Changes a catalog's display information
      description: Changes a catalog's display information such as name, description, and icon.
      operationId: change_catalog_appearance
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeCatalogAppearanceRequest'
        required: true
      responses:
        '200':
          description: Catalog appearance updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Catalog'
  /v0/connections:
    get:
      tags:
      - Connections
      summary: List all connections
      description: List all available connections.
      operationId: get_all_connections
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GetConnectionsEndpointRequest'
        required: true
      responses:
        '200':
          description: All connections retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Connection'
    post:
      tags:
      - Connections
      summary: Add a Connection
      description: Adds a new connection based on the provided url.
      operationId: add_connection
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddConnectionEndpointRequest'
        required: true
      responses:
        '201':
          description: Connection added successfully
          headers:
            Location:
              schema:
                type: string
              description: URI of the newly created connection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
  /v0/connections/accept-pending-changes:
    post:
      tags:
      - Connections
      summary: Accept Pending Changes
      description: Accept pending changes to a connection.
      operationId: accept_connection_changes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptConnectionChangesRequest'
        required: true
      responses:
        '200':
          description: ''
  /v0/connections/remove-connection:
    post:
      tags:
      - Connections
      summary: Remove Connection
      description: Removes a connection by its ID.
      operationId: remove_connection
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveConnectionRequest'
        required: true
      responses:
        '200':
          description: ''
  /v0/connections/sync-connection:
    post:
      tags:
      - Connections
      summary: Sync connection by ID
      description: Sync the latest version of a connection by its unique identifier.
      operationId: sync_connection_by_id
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncConnectionRequest'
        required: true
      responses:
        '200':
          description: ''
  /v0/connections/{id}:
    get:
      tags:
      - Connections
      summary: Get connection by ID
      description: Retrieve a specific connection by its unique identifier.
      operationId: get_connection_by_id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Connection retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
  /v0/create-new-catalog:
    post:
      tags:
      - Library
      - Catalog
      summary: Create a new catalog
      description: Creates a new catalog with the provided display information.
      operationId: create_new_catalog
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCatalogRequest'
        required: true
      responses:
        '201':
          description: Catalog created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Catalog'
  /v0/create-new-template:
    post:
      tags:
      - Library
      - Templates
      summary: Create a new template
      description: Creates a new template which can be used to issue credentials.
      operationId: create_template
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNewTemplateRequestBody'
            examples:
              OpenBadges template:
                description: An OpenBadges 3.0 template. The fields `achievement.name`, `achievement.description`, and `achievement.criteria.narrative` must be explicitly included in the schema.
                value:
                  title: OpenBadges template
                  dataModel: open_badges_3-0
                  holderType: individual
                  schema:
                    type: object
                    properties:
                      achievement.name:
                        type: string
                      achievement.description:
                        type: string
                      achievement.criteria.narrative:
                        type: string
              Standard template:
                description: A simple example that will issue credentials in the W3C Verifiable Credentials Data Model v1.1 format.
                value:
                  title: Standard template
                  dataModel: w3c_vc_data_model_v1-1
                  holderType: individual
        required: true
      responses:
        '201':
          description: New template created successfully
          headers:
            Location:
              schema:
                type: string
              description: The path of the newly created template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
  /v0/create-public-offer:
    post:
      tags:
      - Issuance
      summary: Create a public offer mapping
      operationId: create_public_offer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePublicOfferRequest'
        required: true
      responses:
        '201':
          description: Public offer created successfully
        '400':
          description: Template schema invalid for public offers
        '404':
          description: Template or offer not found
  /v0/credentials:
    get:
      tags:
      - Issuance
      summary: List all credentials
      description: Lists all credentials including their current status and metadata.
      operationId: get_all_credentials
      responses:
        '200':
          description: List of all credentials
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Credential'
    post:
      tags:
      - Credentials
      - Issuance
      summary: Create a credential
      description: Creates a verifiable credential based on the provided template and data. An offer is created for the provided offer ID.
      operationId: create_credential
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialsEndpointRequest'
        required: true
      responses:
        '201':
          description: Credential created successfully
          headers:
            Location:
              schema:
                type: string
              description: URI of the newly created credential
  /v0/credentials/{credential_id}:
    get:
      tags:
      - Issuance
      summary: Get credential by ID
      description: Retrieves a credential by its ID.
      operationId: get_credential_by_id
      parameters:
      - name: credential_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successfully retrieved credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credential'
  /v0/delete-catalog:
    post:
      tags:
      - Library
      - Catalog
      summary: Delete a catalog
      description: Deletes a catalog.
      operationId: delete_catalog
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteCatalogRequest'
        required: true
      responses:
        '204':
          description: Catalog deleted
  /v0/delete-public-offer:
    post:
      tags:
      - Issuance
      summary: Delete a public offer
      operationId: delete_public_offer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeletePublicOfferRequest'
        required: true
      responses:
        '204':
          description: Public offer deleted successfully
        '404':
          description: Public offer not found
  /v0/delete-template:
    post:
      tags:
      - Library
      - Templates
      summary: Delete a template
      description: Deletes a template by marking its status as `Deleted`. Deleted templates will no longer appear in any views.
      operationId: delete_template_by_id
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteTemplateEndpointRequest'
        required: true
      responses:
        '204':
          description: Template deleted successfully
  /v0/documents:
    get:
      tags:
      - Identity
      summary: List DID documents
      description: Retrieves the list of DID documents in use by your organisation.
      operationId: get_all_documents
      parameters:
      - name: did_method
        in: query
        required: false
        schema:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/SupportedDidMethod'
      responses:
        '200':
          description: Documents retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Document'
  /v0/documents/{document_id}:
    get:
      tags:
      - Identity
      summary: Get DID document by ID
      description: Retrieves a DID document of your organisation by its ID.
      operationId: get_document_by_id
      parameters:
      - name: document_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Document retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '404':
          description: Document not found
  /v0/duplicate-template:
    post:
      tags:
      - Library
      - Templates
      summary: Duplicate existing template
      description: Creates a duplicate of an existing template.
      operationId: duplicate_template
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DuplicateTemplateEndpointRequest'
            example:
              sourceTemplateId: 91fc790f-d876-4827-9a9d-0fb0f6766dca
        required: true
      responses:
        '201':
          description: Duplicate created successfully
          headers:
            Location:
              schema:
                type: string
              description: The path of the newly created template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
        '422':
          description: Source Template Not Found
  /v0/events:
    get:
      tags:
      - Events
      summary: Stream domain events as CloudEvents via SSE with Catch-Up.
      operationId: events_sse_handler
      parameters:
      - name: types
        in: query
        description: Comma-separated list of CloudEvent types to filter
        required: false
        schema:
          type: string
      - name: sources
        in: query
        description: Comma-separated list of sources/aggregate types to filter
        required: false
        schema:
          type: string
      - name: subject
        in: query
        description: Optional aggregate/subject ID filter
        required: false
        schema:
          type: string
      - name: since
        in: query
        description: Filter events after RFC 3339 timestamp
        required: false
        schema:
          type: string
      - name: until
        in: query
        description: Filter events before RFC 3339 timestamp
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Server-Sent Events stream of CloudEvents
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/CloudEvent'
  /v0/get-all-catalogs:
    get:
      tags:
      - Library
      - Catalog
      summary: List all Catalogs
      description: List all available Catalogs.
      operationId: get_all_catalogs
      responses:
        '200':
          description: All catalogs retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Catalog'
  /v0/get-all-public-offers:
    get:
      tags:
      - Issuance
      summary: Get all public offers
      operationId: all_public_offers
      responses:
        '200':
          description: Public offers retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicOfferStatusDto'
  /v0/get-catalog-by-id/{catalog_id}:
    get:
      tags:
      - Library
      - Catalog
      summary: Get catalog by ID
      description: Retrieve a specific catalog by its ID.
      operationId: get_catalog_by_id
      parameters:
      - name: catalog_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Catalog retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Catalog'
  /v0/get-template-by-id/{id}:
    get:
      tags:
      - Library
      - Templates
      summary: Get template by ID
      description: Retrieve a specific template by its ID.
      operationId: get_template_by_id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Template retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
  /v0/holder/credentials:
    get:
      tags:
      - Identity
      - Holder
      summary: List all credentials
      description: Retrieves all credentials held by your organisation.
      operationId: get_all_holder_credentials
      responses:
        '200':
          description: All credentials retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CredentialView'
  /v0/holder/credentials/{holder_credential_id}:
    get:
      tags:
      - Identity
      - Holder
      summary: Get credential by ID
      description: Retrieves a credential held by your organisation by its ID.
      operationId: get_holder_credential_by_id
      parameters:
      - name: holder_credential_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Credential retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialView'
        '404':
          description: Credential not found
  /v0/holder/offers:
    get:
      tags:
      - Identity
      - Holder
      summary: List all offers
      description: Retrieves all offers received by your organisation.
      operationId: get_all_holder_credential_offers
      responses:
        '200':
          description: All offers retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OfferView'
  /v0/holder/offers/{offer_id}/accept:
    post:
      tags:
      - Identity
      - Holder
      summary: Accept a credential offer
      description: Accepts a credential offered to your organization by its ID.
      operationId: accept_credential_offer
      parameters:
      - name: offer_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Credential offer accepted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferView'
        '404':
          description: Credential offer not found
  /v0/holder/offers/{offer_id}/reject:
    post:
      tags:
      - Identity
      - Holder
      summary: Rejects a credential offer
      description: Rejects a credential offered to your organization by its ID.
      operationId: reject_credential_offer
      parameters:
      - name: offer_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Credential offer rejected successfully
  /v0/holder/offers/{received_offer_id}:
    get:
      tags:
      - Identity
      - Holder
      summary: Get offer by ID
      description: Retrieves an offer received by your organisation by its ID.
      operationId: get_holder_offer_by_id
      parameters:
      - name: received_offer_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Offer retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferView'
        '404':
          description: Offer not found
  /v0/holder/presentations:
    get:
      tags:
      - Identity
      - Holder
      summary: List all credential presentations
      description: Retrieves all credential presentations held by your organisation.
      operationId: get_all_holder_presentations
      responses:
        '200':
          description: All presentations retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PresentationView'
    post:
      tags:
      - Identity
      - Holder
      summary: Create a new credential presentation
      description: Creates and signs a new credential presentation containing the given credentials held by your organisation.
      operationId: create_holder_presentation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresentationsEndpointRequest'
        required: true
      responses:
        '201':
          description: Presentation created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresentationView'
        '404':
          description: Credential not found
  /v0/holder/presentations/{presentation_id}:
    get:
      tags:
      - Identity
      - Holder
      summary: Get credential presentation by ID
      description: Retrieves a single credential presentation held by your organisation by its ID.
      operationId: get_holder_presentation_by_id
      parameters:
      - name: presentation_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Presentation retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresentationView'
        '404':
          description: Presentation not found
  /v0/list-all-templates:
    get:
      tags:
      - Library
      - Templates
      summary: List all templates
      description: List all available templates.
      operationId: get_all_templates
      responses:
        '200':
          description: All templates retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Template'
  /v0/make-catalog-private:
    post:
      tags:
      - Library
      - Catalog
      summary: Make catalog private
      description: Updates a catalog's visibility to private. If not otherwise specified, the default visibility is private.
      operationId: make_catalog_private
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MakeCatalogPrivateRequest'
        required: true
      responses:
        '200':
          description: Catalog made private successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Catalog'
  /v0/make-catalog-public:
    post:
      tags:
      - Library
      - Catalog
      summary: Make catalog public
      description: Updates a catalog's visibility to public.
      operationId: make_catalog_public
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MakeCatalogPublicRequest'
        required: true
      responses:
        '200':
          description: Catalog make public successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Catalog'
  /v0/offers:
    get:
      tags:
      - Issuance
      summary: Get all offers
      description: List all credential offers.
      operationId: get_all_offers
      responses:
        '200':
          description: All offers retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Offer'
  /v0/offers/send-offer-to-individual:
    post:
      tags:
      - Issuance
      summary: Send offer to individual
      description: Sends a credential offer to an individual's email.
      operationId: send_offer_to_individual
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailOfferEndpointRequest'
        required: true
      responses:
        '200':
          description: Offer sent successfully
  /v0/offers/send-offer-to-organization:
    post:
      tags:
      - Issuance
      summary: Send offer to organization
      description: Sends a credential offer to an organization's URL.
      operationId: send_offer_to_organization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TargetUrlOfferEndpointRequest'
        required: true
      responses:
        '200':
          description: Offer sent successfully
  /v0/offers/{offer_id}:
    get:
      tags:
      - Issuance
      summary: Get offer by ID
      description: Retrieves a credential offer by its ID.
      operationId: get_offer_by_id
      parameters:
      - name: offer_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Offer retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
        '404':
          description: Offer not found
  /v0/profile:
    get:
      tags:
      - Identity
      - Profile
      summary: Get organisation profile
      description: Retrieves the profile information of your organisation.
      operationId: get_profile
      responses:
        '200':
          description: Profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '404':
          description: Profile not found
    patch:
      tags:
      - Identity
      - Profile
      summary: Update organisation profile
      description: Updates your organisation's profile with the given information.
      operationId: update_profile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchProfileEndpointRequest'
        required: true
      responses:
        '200':
          description: Profile updated successfully
  /v0/remove-templates-from-catalog:
    post:
      tags:
      - Library
      - Catalog
      summary: Remove one or more templates from a catalog
      description: Removes one or more templates from a catalog by their ID.
      operationId: remove-templates-from-catalog
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveTemplatesRequest'
        required: true
      responses:
        '200':
          description: Template(s) removed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Catalog'
  /v0/take-public-offer-offline:
    post:
      tags:
      - Issuance
      summary: Take a public offer offline
      operationId: take_public_offer_offline
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TakePublicOfferOfflineRequest'
        required: true
      responses:
        '204':
          description: Public offer taken offline successfully
        '404':
          description: Public offer not found
  /v0/take-public-offer-online:
    post:
      tags:
      - Issuance
      summary: Take a public offer online
      operationId: take_public_offer_online
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TakePublicOfferOnlineRequest'
        required: true
      responses:
        '204':
          description: Public offer taken online successfully
        '404':
          description: Public offer not found
  /v0/update-template:
    post:
      tags:
      - Library
      - Templates
      summary: Update a template
      description: Updates an existing template with the provided content.
      operationId: update_template
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTemplateEndpointRequest'
        required: true
      responses:
        '204':
          description: Template updated successfully
components:
  schemas:
    AcceptConnectionChangesRequest:
      type: object
      required:
      - id
      properties:
        id:
          type: string
    AddConnectionEndpointRequest:
      type: object
      required:
      - url
      properties:
        url:
          type: string
    AddTemplatesRequest:
      type: object
      properties:
        catalogId:
          type: string
          default: ''
        templateIds:
          type: array
          items:
            type: string
          default: []
    Catalog:
      type: object
      description: Data transfer object for Catalogs.
      required:
      - id
      - display
      - template_ids
      - visibility
      - modified_at
      properties:
        display:
          $ref: '#/components/schemas/CatalogDisplay'
        id:
          type: string
        modified_at:
          type: string
          format: date-time
        template_ids:
          type: array
          items:
            type: string
        visibility:
          $ref: '#/components/schemas/CatalogVisibility'
    CatalogDisplay:
      type: object
      required:
      - name
      - description
      properties:
        description:
          type: string
        icon:
          type:
