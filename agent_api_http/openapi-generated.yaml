      - type: object
        description: Relative duration in ISO 8601 format, e.g. `"P3DT4H"` or seconds as `"PT86400S"`.
        required:
        - value
        - type
        properties:
          type:
            type: string
            enum:
            - duration
          value:
            type: string
            description: Relative duration in ISO 8601 format, e.g. `"P3DT4H"` or seconds as `"PT86400S"`.
      - type: object
        description: Absolute datetime in ISO 8601 format, e.g. `"2026-12-31T23:59:59Z"`.
        required:
        - value
        - type
        properties:
          type:
            type: string
            enum:
            - date-time
          value:
            type: string
            description: Absolute datetime in ISO 8601 format, e.g. `"2026-12-31T23:59:59Z"`.
