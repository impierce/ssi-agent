      description: 'Token Request as described here: https://openid.net/specs/openid-4-verifiable-credential-issuance-1_0.html#name-token-request'
    TokenResponse:
      type: object
      description: 'Token Response as described here: https://openid.net/specs/openid-4-verifiable-credential-issuance-1_0.html#name-successful-token-response'
      required:
      - access_token
      - token_type
      properties:
        access_token:
          type: string
        authorization_details:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/AuthorizationDetailsObject'
        expires_in:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
        refresh_token:
          type:
          - string
          - 'null'
        scope:
          type:
          - string
          - 'null'
        token_type:
          type: string
    TxCodeConstraints:
      type: object
      properties:
        description:
          type: string
          description: The length of the description must not exceed 300 characters.
          examples:
          - Please provide the one-time code you received via email.
          maxLength: 300
        input_mode:
          oneOf:
          - type: 'null'
          - type: string
            enum:
            - numeric
            - text
          default: numeric
        length:
          type:
          - integer
          - 'null'
          format: int32
          description: The length of the PIN must be between 0 and 255 characters.
          examples:
          - $serde_json::private::Number: '6'
          maximum: 255
          minimum: 0
    TypeMetadata:
      type: object
      description: |-
        OpenAPI representation of `identity_credential::sd_jwt_vc::metadata::TypeMetadata`.

        See [SD-JWT VC Type Metadata](https://datatracker.ietf.org/doc/html/draft-ietf-oauth-sd-jwt-vc#name-sd-jwt-vc-type-metadata).
      properties:
        claims:
          type: array
          items:
            $ref: '#/components/schemas/TypeMetadataClaim'
        description:
          type:
          - string
          - 'null'
          description: A human-readable description for the type.
        display:
          type: array
          items:
            $ref: '#/components/schemas/TypeMetadataDisplay'
        extends:
          type:
          - string
          - 'null'
          format: uri
          description: A URI of another type that this type extends.
        extends#integrity:
          type:
          - string
          - 'null'
          description: Integrity metadata for the extended type.
        name:
          type:
          - string
          - 'null'
          description: A human-readable name for the type.
        schema:
          type:
          - object
          - 'null'
          description: An embedded JSON Schema for the credential.
          additionalProperties: {}
          propertyNames:
            type: string
        schema_uri:
          type:
          - string
          - 'null'
          format: uri
          description: A URI referencing a JSON Schema for the credential.
        schema_uri#integrity:
          type:
          - string
          - 'null'
          description: Integrity metadata for the referenced JSON Schema.
    TypeMetadataClaim:
      type: object
      description: Information about particular claims of an SD-JWT VC type.
      required:
      - path
      properties:
        display:
          type: array
          items:
            $ref: '#/components/schemas/TypeMetadataClaimDisplay'
        mandatory:
          type:
          - boolean
          - 'null'
          description: Whether the claim must be present in the issued credential.
        path:
          $ref: '#/components/schemas/ClaimPathPointer'
        sd:
          oneOf:
          - type: 'null'
          - type: string
            enum:
            - always
            - allowed
            - never
          description: Whether the claim is selectively disclosable.
        svg_id:
          type:
          - string
          - 'null'
          description: The ID of the claim for reference in an SVG template.
    TypeMetadataClaimDisplay:
      type: object
      description: Display information for a claim.
      required:
      - locale
      - label
      properties:
        description:
          type:
          - string
          - 'null'
        label:
          type: string
        locale:
          type: string
          description: A language tag as defined in [RFC 5646](https://www.rfc-editor.org/rfc/rfc5646.txt).
    TypeMetadataDisplay:
      type: object
      description: Display information for an SD-JWT VC type.
      required:
      - locale
      - name
      properties:
        description:
          type:
          - string
          - 'null'
        locale:
          type: string
          description: A language tag as defined in [RFC 5646](https://www.rfc-editor.org/rfc/rfc5646.txt).
        name:
          type: string
        rendering:
          type:
          - object
          - 'null'
          description: Rendering information, such as `simple` or `svg_templates`.
          additionalProperties: {}
          propertyNames:
            type: string
    UpdateTemplateEndpointRequest:
      type: object
      properties:
        credentialExpiration:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Expiration'
          default: null
        description:
          type:
          - string
          - 'null'
          default: null
        display:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Display'
          default: null
        holderAuthorization:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/HolderAuthorization'
          default: null
        id:
          type: string
          default: ''
        schema: {}
        schemaPropertiesAttributes:
          type:
          - object
          - 'null'
          default: null
          additionalProperties:
            $ref: '#/components/schemas/PropertyAttribute'
          propertyNames:
            type: string
        status:
          oneOf:
          - type: 'null'
          - type: string
            enum:
            - draft
            - published
            - archived
            - deleted
          default: null
        tags:
          type:
          - array
          - 'null'
          items:
            type: string
          default: null
        title:
          type:
          - string
          - 'null'
          default: null
        type:
          type:
          - array
          - 'null'
          items:
            type: string
          default: null
        visibility:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Visibility'
          default: null
      additionalProperties: false
    Validation:
      oneOf:
      - type: object
        required:
        - DomainLinkage
        properties:
          DomainLinkage:
            $ref: '#/components/schemas/DomainLinkageValidation'
      - type: object
        required:
        - LinkedVp
        properties:
          LinkedVp:
            $ref: '#/components/schemas/LinkedVpValidation'
    ValidationResult:
      type: object
      required:
      - valid
      - last_validated_at
      properties:
        error:
          type:
          - string
          - 'null'
        last_validated_at:
          type: string
          format: date-time
        valid:
          type: boolean
    VcSdJwtCredentialDefinition:
      type: object
      description: Credential definition for the `vc+sd-jwt` format.
      required:
      - type
      properties:
        type:
          type: array
          items:
            type: string
    VcSdJwtParameters:
      type: object
      required:
      - credential_definition
      properties:
        credential_definition:
          $ref: '#/components/schemas/VcSdJwtCredentialDefinition'
    Version:
      type: object
      properties:
        git_commit_hash:
          type:
          - string
          - 'null'
          description: The git commit hash from which the application was built.
        version:
          type:
          - string
          - 'null'
          description: The current version of the application.
    Visibility:
      type: string
      enum:
      - private
      - public
    VpTokenAuthorizationResponse:
      type: object
      description: |-
        An [OID4VP](https://openid.net/specs/openid-4-verifiable-presentations-1_0.html#name-response) authorization
        response.
      required:
      - state
      - vp_token
      properties:
        state:
          type: string
          description: The `state` of the authorization request, which identifies it.
        vp_token:
          type: string
          description: JSON-encoded object that maps each DCQL credential query ID to a non-empty array of presentations.
  securitySchemes:
    access_token:
      type: http
      scheme: bearer
      description: Access token issued by the `/auth/token` endpoint.
tags:
- name: Configuration
  description: Inspect UniCore application configuration.
- name: Identity
  description: Manage all aspects of your organisational identity.
- name: Holder
  description: Manage the credentials your organisation holds itself.
- name: Events
  description: Stream domain events as CloudEvents via SSE.
- name: Connections
  description: Manage trusted connections.
- name: Profile
  description: Manage your organisational profile.
- name: Credentials
  description: Create and revoke verifiable credentials.
- name: Issuance
  description: Issue credentials to individuals and organizations, manage credential offers and track their status.
- name: Library
  description: Manage your own templates, browse and import external templates.
- name: Templates
  description: Create and manage templates which provide the structure for credentials to be issued.
- name: Catalog
  description: Create and manage catalogs to organize and share your templates.
- name: Authorization Requests
  description: Manage requests for verifiable presentations and their responses.
- name: Public
  description: Endpoints that are publicly reachable without authentication, used to expose publicly available information or communicate with external systems.
- name: Metadata
  description: Inspect application build and runtime metadata.
- name: Probes
  description: Inspect application liveness and readiness.
- name: OpenAPI
  description: Inspect the OpenAPI description of this application.
- name: Protocol
  description: Endpoints defined by external standards, used by wallets, verifiers and resolvers.
- name: DID
  description: Resolve the DID documents and domain linkage of this application.
- name: OAuth 2.0
  description: Authorize wallets through the OAuth 2.0 authorization server.
- name: OpenID4VCI
  description: Issue and receive credentials with OpenID for Verifiable Credential Issuance.
- name: OID4VP / SIOPv2
  description: Request and verify presentations with OpenID for Verifiable Presentations and Self-Issued OpenID Provider v2.
- name: Status List
  description: Retrieve credential status lists as defined by OAuth Token Status List.
- name: SD-JWT VC
  description: Retrieve SD-JWT VC type metadata.
externalDocs:
  url: https://docs.impierce.com/unicore
  description: Official UniCore documentation
