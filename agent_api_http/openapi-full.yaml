        '422':
          description: Request body does not match the expected schema
  /v0/verify-linked-domains:
    get:
      tags:
      - Identity
      summary: Verify linked domains
      description: |-
        Checks every linked domain the way an external verifier would: resolves each origin's published
        DID configuration over the network and validates it, alongside a freshly resolved `CNAME` lookup
        showing whether the domain points at this deployment.
      operationId: verify_linked_domains
      responses:
        '200':
          description: Verification result per linked domain
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkedDomainsVerification'
        '401':
          description: Authentication required
        '403':
          description: Operation forbidden
  /vct/{credential_configuration_id}/{version}:
    get:
      tags:
      - SD-JWT VC
      - Protocol
      summary: Get SD-JWT VC type metadata
      description: |-
        Returns the type metadata of a credential configuration, as defined by
        [SD-JWT VC](https://datatracker.ietf.org/doc/html/draft-ietf-oauth-sd-jwt-vc#name-sd-jwt-vc-type-metadata).
      operationId: vct_type_metadata
      parameters:
      - name: credential_configuration_id
        in: path
        description: Base64url-encoded (without padding) credential configuration ID
        required: true
        schema:
          type: string
      - name: version
        in: path
        description: Type version (currently ignored)
        required: true
        schema:
          type: string
      responses:
        '200':
          description: SD-JWT VC type metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TypeMetadata'
        '404':
          description: The credential configuration does not exist
        '500':
          description: The type metadata could not be retrieved
  /version:
    get:
      tags:
      - Metadata
      summary: Returns the `version` and the `git_commit_hash` of the application.
      operationId: version
      responses:
        '200':
          description: Application version information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
components:
