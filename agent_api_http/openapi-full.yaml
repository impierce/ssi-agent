    LinkedCredentialValidation:
      type: object
      required:
      - jwt
      - result
      properties:
        credential:
          type: object
          required:
          - '@context'
          - type
          - credentialSubject
          - issuer
          - issuanceDate
          properties:
            '@context':
              oneOf:
              - oneOf:
                - type: string
                  format: uri
                - type: object
                  additionalProperties: true
              - type: array
                items:
                  oneOf:
                  - type: string
                    format: uri
                  - type: object
                    additionalProperties: true
            credentialSchema:
              oneOf:
              - type: object
                additionalProperties: true
              - type: array
                items:
                  type: object
                  additionalProperties: true
            credentialStatus:
              type: object
              additionalProperties: true
            credentialSubject:
              oneOf:
              - type: object
                additionalProperties: true
              - type: array
                items:
                  type: object
                  additionalProperties: true
            evidence:
              oneOf:
              - type: object
                additionalProperties: true
              - type: array
                items:
                  type: object
                  additionalProperties: true
            expirationDate:
              type: string
              format: date-time
            id:
              type: string
              format: uri
            issuanceDate:
              type: string
              format: date-time
            issuer:
              oneOf:
              - type: string
                format: uri
              - type: object
                required:
                - id
                properties:
                  id:
                    type: string
                    format: uri
                additionalProperties: true
            nonTransferable:
              type: boolean
            proof:
              type: object
              additionalProperties: true
            refreshService:
              oneOf:
              - type: object
                additionalProperties: true
              - type: array
                items:
                  type: object
                  additionalProperties: true
            termsOfUse:
              oneOf:
              - type: object
                additionalProperties: true
              - type: array
                items:
                  type: object
                  additionalProperties: true
            type:
              oneOf:
              - type: string
              - type: array
                items:
                  type: string
          additionalProperties: true
        jwt:
          type: string
          description: The raw credential JWT exactly as it appeared in the presentation.
        result:
          $ref: '#/components/schemas/ValidationResult'
          description: |-
            Cryptographic and semantic validity against the credential's declared issuer DID. A valid
            result does not establish that the issuer is trusted or associated with a known domain.
    LinkedDomainVerification:
      type: object
      description: The outcome of verifying one linked domain.
      required:
      - origin
      - valid
      - linkage_valid
      - dns
      properties:
        dns:
          $ref: '#/components/schemas/CnameCheck'
          description: Whether this origin's DNS points at the deployment.
        linkage_valid:
          type: boolean
          description: Whether this origin's published configuration validates against the DIDs UniCore linked to it.
        message:
          type:
          - string
          - 'null'
          description: What went wrong, or `None` when this origin verified.
        origin:
          type: string
          example: https://example.org
        valid:
          type: boolean
          description: |-
            Whether an external verifier resolving this origin would accept the linkage. This is the
            authoritative result; `dns` is a diagnostic, because a domain can be served correctly without
            a `CNAME` record — an apex domain cannot have one.
    LinkedDomainsVerification:
      type: object
      description: The outcome of verifying every linked domain, mirroring what an external verifier would see.
      required:
      - valid
      - origins
      properties:
        message:
          type:
          - string
          - 'null'
          description: |-
            Why verification could not be attempted at all, e.g. because no domain is linked. `None` when
            the per-origin results below carry the outcome.
        origins:
          type: array
          items:
            $ref: '#/components/schemas/LinkedDomainVerification'
        valid:
          type: boolean
          description: Whether every linked domain verified.
    LinkedVerifiablePresentation:
      type: object
      required:
      - presentation_id
      - holder
      - url
      properties:
        holder:
          type: string
          description: The DID that signed the presentation and is the subject of its credentials.
        presentation_id:
          type: string
        url:
          type: string
          description: The absolute URL at which the presentation was published when it was added.
    LinkedVerifiablePresentationsRequest:
      type: object
      required:
      - presentationIds
      properties:
        presentationIds:
          type: array
          items:
            type: string
          description: Presentation IDs to publish or withdraw.
          minItems: 1
    LinkedVpValidation:
      type: object
      required:
      - url
      - did
      - domain_linkage_valid
      - result
      - credentials
      properties:
        credentials:
          type: array
          items:
            $ref: '#/components/schemas/LinkedCredentialValidation'
          description: |-
            Every credential embedded in the presentation, each with its own validation outcome.
            Credentials that failed validation are still returned, flagged as invalid.
        did:
          type: string
          description: The linked DID whose DID Document advertised this presentation.
        domain_linkage_valid:
          type: boolean
          description: |-
            Whether `did` is verifiably linked to the connection's domain. When `false` the
            presentation is still fetched, validated and returned, but nothing ties it to the domain.
            The corresponding [`DomainLinkageValidation`] contains the linkage error.
        result:
          $ref: '#/components/schemas/ValidationResult'
          description: |-
            Outcome of validating the presentation itself. `valid` is `true` only when the
            presentation's signature verified *and* every embedded credential validated.
        url:
          type: string
          format: uri
