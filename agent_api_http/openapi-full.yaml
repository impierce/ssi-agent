    post:
      tags:
      - Issuance
      summary: Send offer to organization
      description: Sends a credential offer to an organization's URL.
      operationId: send_offer_to_organization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TargetUrlOfferEndpointRequest'
        required: true
      responses:
        '200':
          description: Offer sent successfully
        '400':
          description: The credential offer does not exist
        '422':
          description: Request body does not match the expected schema
  /v0/offers/{offer_id}:
    get:
      tags:
      - Issuance
      summary: Get offer by ID
      description: Retrieves a credential offer by its ID.
      operationId: get_offer_by_id
      parameters:
      - name: offer_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Offer retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
        '400':
          description: Invalid path parameter
        '404':
          description: Offer not found
  /v0/profile:
    get:
      tags:
      - Identity
      - Profile
      summary: Get organisation profile
      description: Retrieves the profile information of your organisation.
      operationId: get_profile
      responses:
        '200':
          description: Profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '404':
          description: Profile not found
    patch:
      tags:
      - Identity
      - Profile
      summary: Update organisation profile
      description: Updates your organisation's profile with the given information.
      operationId: update_profile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchProfileEndpointRequest'
        required: true
      responses:
        '200':
          description: Profile updated successfully
        '400':
          description: Malformed JSON request body
        '409':
          description: The profile was provisioned through configuration and cannot be modified at runtime
        '422':
          description: Request body does not match the expected schema
  /v0/remove-linked-domains:
    post:
      tags:
      - Identity
      summary: Unlink domains
      description: |-
        Withdraws the Domain Linkage Credentials for each given origin. Unlinking an origin that is not
        linked is a no-op, and unlinking the last remaining origin removes the service entirely.
      operationId: remove_linked_domains
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: |-
                The origins to link or unlink, each either a bare host (`example.org`) or a full origin
                (`https://example.org`). Independent of the deployment's own DID.
              required:
              - origins
              properties:
                origins:
                  type: array
                  items:
                    type: string
                  example:
                  - example.org
                  - https://foo.example.org
        required: true
      responses:
        '204':
          description: Domains unlinked
        '400':
          description: An invalid origin
        '401':
          description: Authentication required
        '403':
          description: Operation forbidden
        '422':
          description: Request body does not match the expected schema
  /v0/remove-linked-verifiable-presentations:
    post:
      tags:
      - Identity
      summary: Remove linked verifiable presentations
      description: |-
        Withdraws the given presentations while preserving all others in their existing order. Unknown
        IDs and duplicates are no-ops; removing a holder's last presentation removes its DID service.
      operationId: remove_linked_verifiable_presentations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkedVerifiablePresentationsRequest'
        required: true
      responses:
        '204':
          description: Presentations withdrawn
        '400':
          description: Malformed JSON request body
        '401':
          description: Authentication required
        '403':
          description: Operation forbidden
        '422':
          description: Empty presentation ID list
  /v0/remove-templates-from-catalog:
