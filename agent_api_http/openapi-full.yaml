    InteractionType:
      oneOf:
      - type: string
        description: The Wallet supports an OpenID4VP Presentation interaction.
        enum:
        - urn:openid:dcp:iae:openid4vp_presentation
      - type: string
        description: The Wallet supports a redirect to a web-based interaction.
        enum:
        - urn:openid:dcp:iae:redirect_to_web
      - type: string
        description: Custom interaction type defined by an extension.
      description: Interaction types supported by the Wallet as defined in Section 6.1.1.
    InteractiveAuthorizationFollowUpRequest:
      type: object
      description: |-
        A follow-up request to the Interactive Authorization Endpoint, as defined in Section 6.1.2.

        Follow-up requests include the `auth_session` value received most recently from the
        Authorization Server. Additional parameters depend on the interaction type.
      required:
      - auth_session
      properties:
        auth_session:
          type: string
          description: The auth_session value from the most recent IAE response.
        code_verifier:
          type:
          - string
          - 'null'
          description: |-
            The PKCE code verifier, required after a `urn:openid:dcp:iae:redirect_to_web`
            interaction if PKCE was used in the initial request.
        openid4vp_response:
          description: |-
            The OpenID4VP Authorization Response (JSON-encoded), present when responding
            to a `urn:openid:dcp:iae:openid4vp_presentation` interaction.
    InteractiveAuthorizationRequest:
      allOf:
      - $ref: '#/components/schemas/AuthorizationRequest'
      - type: object
        required:
        - interaction_types_supported
        properties:
          interaction_types_supported:
            type: string
            description: Comma-separated list of interaction types the Wallet supports.
      description: |-
        The initial request to the Interactive Authorization Endpoint, as defined in Section 6.1.1.

        Formed and sent in the same way as a PAR request (RFC 9126 Section 2.1), with the addition
        of the `interaction_types_supported` parameter.
    InteractiveAuthorizationResponse:
      type: object
      description: |-
        Response from the Interactive Authorization Endpoint, as defined in Section 6.2.

        The response indicates either that user interaction is required, that the authorization
        was completed successfully (with an authorization code), or an error.
      required:
      - status
      properties:
        auth_session:
          type:
          - string
          - 'null'
          description: |-
            A value that allows the Authorization Server to associate subsequent requests
            with the ongoing authorization request sequence. Must be included in follow-up requests.
        code:
          type:
          - string
          - 'null'
          description: The authorization code, present when `status` is `ok`.
        expires_in:
          type:
          - integer
          - 'null'
          format: int64
          description: The lifetime of the `request_uri` in seconds.
        openid4vp_request:
          description: |-
            An OpenID4VP Authorization Request for the Wallet to process.
            May contain either a plain request object or a signed request (`{"request": "eyJ..."}`).
        request_uri:
          type:
          - string
          - 'null'
          description: A request_uri for building an Authorization Request via browser redirect.
        status:
          $ref: '#/components/schemas/InteractiveAuthorizationStatus'
          description: Whether an additional interaction is required or the authorization has been completed.
        type:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/InteractionType'
            description: The interaction type required by the Authorization Server.
    InteractiveAuthorizationStatus:
      type: string
      description: The response status from the Interactive Authorization Endpoint.
      enum:
      - require_interaction
      - ok
