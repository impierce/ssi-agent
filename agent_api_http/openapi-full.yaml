openapi: 3.1.0
info:
  title: UniCore HTTP API
  description: ''
  license:
    name: Apache 2.0
  version: 0.0.0-semantically-released
servers:
- url: http://localhost:3033
  description: Local development
paths:
  /.well-known/did-configuration.json:
    get:
      tags:
      - DID
      - Protocol
      summary: Get the DID Configuration resource
      description: |-
        Returns the DID Configuration resource that links this domain to the DIDs of this application, as defined by
        [Well Known DID Configuration](https://identity.foundation/.well-known/resources/did-configuration/).
      operationId: well_known_did_configuration_json
      responses:
        '200':
          description: DID Configuration resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainLinkageConfiguration'
        '404':
          description: No domain is linked
        '500':
          description: The DID Configuration resource could not be retrieved
  /.well-known/did.json:
    get:
      tags:
      - DID
      - Protocol
      summary: Get the `did:web` DID document
      description: |-
        Returns the enabled `did:web` DID document of this application, as resolved by
        [did:web](https://w3c-ccg.github.io/did-method-web/) resolvers.
      operationId: well_known_did_json
      responses:
        '200':
          description: DID document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DidDocument'
        '404':
          description: No enabled `did:web` DID document exists
        '500':
          description: The DID document could not be retrieved
  /.well-known/oauth-authorization-server:
    get:
      tags:
      - OAuth 2.0
      - Protocol
      summary: Get the OAuth 2.0 Authorization Server Metadata
      description: |-
        Returns the metadata of the authorization server as defined by
        [RFC 8414](https://www.rfc-editor.org/rfc/rfc8414.html).
      operationId: well_known_oauth_authorization_server
      responses:
        '200':
          description: Authorization server metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationServerMetadata'
        '404':
          description: The authorization server metadata is not configured
        '500':
          description: The authorization server metadata could not be retrieved
  /.well-known/openid-credential-issuer:
    get:
      tags:
      - OpenID4VCI
      - Protocol
      summary: Get the Credential Issuer Metadata
      description: |-
        Returns the metadata of the credential issuer as defined by
        [OpenID4VCI](https://openid.net/specs/openid-4-verifiable-credential-issuance-1_0.html#name-credential-issuer-metadata).
      operationId: well_known_openid_credential_issuer
      responses:
        '200':
          description: Credential issuer metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialIssuerMetadata'
        '404':
          description: The credential issuer metadata is not configured
        '500':
          description: The credential issuer metadata could not be retrieved
  /auth/authorize:
    get:
      tags:
      - OAuth 2.0
      - Protocol
      summary: Authorize a pushed authorization request
      description: |-
        Starts the authorization of a pushed authorization request by reference, as defined by
        [RFC 9126](https://www.rfc-editor.org/rfc/rfc9126.html#name-authorization-request). The user agent is
        redirected to the consent page, or back to the client once consent has been given.
      operationId: auth_authorize
      parameters:
      - name: client_id
        in: query
        required: true
        schema:
          type: string
      - name: request_uri
        in: query
        required: true
        schema:
          type: string
      responses:
        '302':
          description: Redirect to the client's redirect URI
          headers:
            Location:
              schema:
                type: string
              description: The client's redirect URI
        '303':
          description: Redirect to the consent page
          headers:
            Location:
              schema:
                type: string
              description: The consent page URI
        '400':
          description: The query string is invalid
        '500':
          description: The authorization request could not be processed
  /auth/consent:
    get:
      tags:
      - OAuth 2.0
      - Protocol
      summary: Get the consent page
      description: Renders the HTML page on which the end-user grants or denies consent to a pushed authorization request.
      operationId: get_consent
      parameters:
      - name: request_uri
        in: query
        description: The `request_uri` returned by the pushed authorization request endpoint
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Consent page
          content:
            text/html:
              schema:
                type: string
        '400':
          description: The query string is invalid
        '500':
          description: The consent page could not be rendered
    post:
      tags:
      - OAuth 2.0
      - Protocol
      summary: Submit consent
      description: Records whether the end-user granted consent and redirects the user agent back to the client.
      operationId: post_consent
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConsentForm'
        required: true
      responses:
        '302':
          description: Redirect to the client's redirect URI
          headers:
            Location:
              schema:
                type: string
              description: The client's redirect URI
        '415':
          description: The request body is not `application/x-www-form-urlencoded`
        '422':
          description: The request body is not a valid consent form
        '500':
          description: The consent could not be recorded
  /auth/par:
    post:
      tags:
      - OAuth 2.0
      - Protocol
      summary: Push an authorization request
      description: |-
        Handles the Pushed Authorization Request (PAR) endpoint as defined by
        [RFC 9126](https://www.rfc-editor.org/rfc/rfc9126.html), as well as the Interactive Authorization Request flow
        as defined in OpenID4VCI 1.1.

        Nested values, such as `authorization_details`, are JSON-encoded form values.
      operationId: auth_par
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AuthorizationRequestDto'
        required: true
      responses:
        '200':
          description: Interactive authorization response to an initial or follow-up interactive authorization request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InteractiveAuthorizationResponse'
        '201':
          description: Pushed authorization response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushedAuthorizationResponse'
        '400':
          description: The request body is not `application/x-www-form-urlencoded`
        '422':
          description: The request body is not a valid authorization request
        '500':
          description: The authorization request could not be processed
  /auth/token:
    post:
      tags:
      - OAuth 2.0
      - Protocol
      summary: Request an access token
      description: |-
        Exchanges an authorization code or a pre-authorized code for an access token, as defined by
        [OpenID4VCI](https://openid.net/specs/openid-4-verifiable-credential-issuance-1_0.html#name-token-endpoint).
      operationId: auth_token
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRequest'
        required: true
      responses:
        '200':
          description: Access token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: The token request is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OID4VCError_TokenErrorResponse'
        '401':
          description: The client is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OID4VCError_TokenErrorResponse'
        '415':
          description: The request body is not `application/x-www-form-urlencoded`
        '422':
          description: The request body is not a valid token request
        '500':
          description: The access token could not be issued
  /credential_offer:
    get:
      tags:
      - OpenID4VCI
      - Protocol
      summary: Receive a credential offer
      description: |-
        Receives a credential offer from a credential issuer, as defined by
        [OpenID4VCI](https://openid.net/specs/openid-4-verifiable-credential-issuance-1_0.html#name-credential-offer-endpoint).
        `credential_offer` takes precedence when both parameters are present.
      operationId: credential_offer
      parameters:
      - name: credential_offer
        in: query
        description: JSON-encoded credential offer.
        required: false
        schema:
          type: string
      - name: credential_offer_uri
        in: query
        description: URL from which the credential offer can be retrieved.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Credential offer received
        '400':
          description: Neither parameter is present, or the credential offer is invalid
        '500':
          description: The credential offer could not be stored
  /healthz:
    get:
      tags:
      - Probes
      summary: An alias for the liveness probe.
      operationId: healthz
      responses:
        '200':
          description: Application is alive
  /ietf-oauth-token-status-list/{path}:
    get:
      tags:
      - Status List
      - Protocol
      summary: Get a status list token
      description: |-
        Returns a gzip-encoded Status List Token, as defined by
        [Token Status List](https://datatracker.ietf.org/doc/html/draft-ietf-oauth-status-list#name-status-list-request).
      operationId: token_status_list
      parameters:
      - name: path
        in: path
        description: Status list ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Status List Token as a compact JWT
          headers:
            Content-Encoding:
              schema:
                type: string
              description: Always `gzip`
          content:
            application/statuslist+jwt:
              schema:
                type: string
        '404':
          description: The status list does not exist
        '500':
          description: The status list token could not be created
  /info:
    get:
      tags:
      - Metadata
      summary: Returns the `version`, application `uptime` among other build metadata.
      operationId: info
      responses:
        '200':
          description: Application information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Info'
  /linked-verifiable-presentations/{presentation_id}:
    get:
      tags:
      - DID
      - Protocol
      summary: Get a linked verifiable presentation
      description: |-
        Serves a published presentation to anyone resolving its holder's DID document, without
        authentication, as defined by [Linked Verifiable Presentation](https://identity.foundation/linked-vp/).
        Presentations that are not published answer `404`.
      operationId: linked_verifiable_presentation
      parameters:
      - name: presentation_id
        in: path
        description: Credential presentation ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Signed credential presentation
          content:
            application/jwt:
              schema:
                type: string
        '400':
          description: Invalid path parameter
        '404':
          description: The presentation is not published
        '500':
          description: The presentation could not be retrieved
  /livez:
    get:
      tags:
      - Probes
      summary: A simple liveness probe following application monitoring conventions.
      operationId: livez
      responses:
        '200':
          description: Application is alive
  /openapi.yaml:
    get:
      tags:
      - OpenAPI
      summary: Get the OpenAPI document
      description: Returns the OpenAPI description of the endpoints published by this application.
      operationId: openapi_yaml
      responses:
        '200':
          description: OpenAPI document
          content:
            application/yaml:
              schema:
                type: string
        '500':
          description: OpenAPI document serialization failed
  /openid4vci/credential:
    post:
      tags:
      - OpenID4VCI
      - Protocol
      summary: Issue credentials
      description: |-
        Issues the credentials of an offer in exchange for a valid access token and key proofs, as defined by
        [OpenID4VCI](https://openid.net/specs/openid-4-verifiable-credential-issuance-1_0.html#name-credential-endpoint).
      operationId: openid4vci_credential
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialRequest'
        required: true
      responses:
        '200':
          description: Credentials issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialResponse'
        '400':
          description: The credential request is invalid, or the `Authorization` header is missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OID4VCError_CredentialErrorResponse'
        '401':
          description: The access token is invalid or expired
          headers:
            WWW-Authenticate:
              schema:
                type: string
              description: '`Bearer error="invalid_token"`'
          content:
            application/json:
              example:
                error: invalid_token
        '415':
          description: The request body is not `application/json`
        '422':
          description: The request body is not a valid credential request
        '500':
          description: The credentials could not be issued
      security:
      - access_token: []
  /openid4vci/credential-offer/{offer_id}:
    get:
      tags:
      - OpenID4VCI
      - Protocol
      summary: Get a credential offer
      description: |-
        Returns the credential offer referenced by a `credential_offer_uri`, as defined by
        [OpenID4VCI](https://openid.net/specs/openid-4-verifiable-credential-issuance-1_0.html#name-sending-credential-offer-by-).
      operationId: openid4vci_credential_offer
      parameters:
      - name: offer_id
        in: path
        description: Credential offer ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Credential offer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialOfferParameters'
        '404':
          description: The credential offer does not exist or cannot be resolved
        '500':
          description: The credential offer could not be retrieved
  /openid4vci/nonce:
    post:
      tags:
      - OpenID4VCI
      - Protocol
      summary: Get a fresh nonce
      description: |-
        Returns a fresh `c_nonce` to be used in key proofs, as defined by
        [OpenID4VCI](https://openid.net/specs/openid-4-verifiable-credential-issuance-1_0.html#name-nonce-endpoint).
      operationId: openid4vci_nonce
      responses:
        '200':
          description: Fresh nonce
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always `no-store`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NonceResponse'
        '500':
          description: The nonce could not be generated
  /openid4vci/notification:
    post:
      tags:
      - OpenID4VCI
      - Protocol
      summary: Notify the credential issuer
      description: |-
        Receives a notification about the outcome of a credential issuance, as defined by
        [OpenID4VCI](https://openid.net/specs/openid-4-verifiable-credential-issuance-1_0.html#name-notification-endpoint).

        Errors use the HTTP status code 400 (Bad Request) and the content type `application/json`, as described in the
        [Notification Error Response](https://openid.net/specs/openid-4-verifiable-credential-issuance-1_0.html#name-notification-error-response).
      operationId: openid4vci_notification
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationRequest'
        required: true
      responses:
        '204':
          description: Notification received
        '400':
          description: The notification request or its `notification_id` is invalid, or the `Authorization` header is missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OID4VCError_NotificationErrorResponse'
        '401':
          description: The access token is invalid or expired
          headers:
            WWW-Authenticate:
              schema:
                type: string
              description: '`Bearer error="invalid_token"`'
          content:
            application/json:
              example:
                error: invalid_token
        '415':
          description: The request body is not `application/json`
        '500':
          description: The notification could not be stored
      security:
      - access_token: []
  /public/sponsoring-configuration:
    get:
      tags:
      - Public
      summary: Get the public sponsoring configuration
      description: Returns the public display name, optional logo, and IOTA address used by sponsored identities.
      operationId: sponsoring_configuration
      responses:
        '200':
          description: Sponsoring configuration retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SponsoringConfiguration'
        '404':
          description: No sponsoring IOTA address is configured
        '500':
          description: No display configuration is available
  /public/templates:
    get:
      tags:
      - Public
      summary: List all public templates
      description: Lists every template that is publicly visible and published. No authentication is required.
      operationId: get_public_templates
      responses:
        '200':
          description: All public templates retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicTemplate'
  /readyz:
    get:
      tags:
      - Probes
      summary: A readiness probe that reports whether persisted events are compatible.
      operationId: readyz
      responses:
        '200':
          description: Application is ready
        '503':
          description: Application is not ready
  /redirect:
    post:
      tags:
      - OID4VP / SIOPv2
      - Protocol
      summary: Submit an authorization response
      description: |-
        Receives and verifies the authorization response of a SIOPv2 or OID4VP authorization request, sent with the
        `direct_post` response mode.
      operationId: redirect
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AuthorizationResponseForm'
        required: true
      responses:
        '200':
          description: Authorization response verified
        '400':
          description: The authorization response is malformed or has no `state`
        '500':
          description: The authorization response could not be verified
  /request/{request_id}:
    get:
      tags:
      - OID4VP / SIOPv2
      - Protocol
      summary: Get a request object
      description: |-
        Instead of directly embedding the Authorization Request into a QR-code or deeplink, the `Relying Party` can embed a
        `request_uri` that points to this endpoint from where the Authorization Request Object can be retrieved, as
        described in [RFC 9101](https://www.rfc-editor.org/rfc/rfc9101.html#name-passing-a-request-object-by-).
      operationId: request_object
      parameters:
      - name: request_id
        in: path
        description: Authorization request ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Signed authorization request object
          content:
            application/oauth-authz-req+jwt:
              schema:
                type: string
        '404':
          description: The authorization request does not exist
        '500':
          description: The authorization request could not be retrieved
  /v0/add-linked-domains:
    post:
      tags:
      - Identity
      summary: Link domains
      description: |-
        Publishes a Domain Linkage Credential for each given origin, in addition to any already linked.
        Linking an origin that is already linked is a no-op.
      operationId: add_linked_domains
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: |-
                The origins to link or unlink, each either a bare host (`example.org`) or a full origin
                (`https://example.org`). Independent of the deployment's own DID.
              required:
              - origins
              properties:
                origins:
                  type: array
                  items:
                    type: string
                  example:
                  - example.org
                  - https://foo.example.org
        required: true
      responses:
        '204':
          description: Domains linked
        '400':
          description: No eligible signing DID, or an invalid origin
        '401':
          description: Authentication required
        '403':
          description: Operation forbidden
        '422':
          description: Request body does not match the expected schema
  /v0/add-linked-verifiable-presentations:
    post:
      tags:
      - Identity
      summary: Add linked verifiable presentations
      description: |-
        Publishes the given presentations after the presentations, signatures, holders and credential
        subjects have been validated. Existing IDs and duplicates are no-ops; new IDs retain request
        order after presentations that were already published.
      operationId: add_linked_verifiable_presentations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkedVerifiablePresentationsRequest'
        required: true
      responses:
        '204':
          description: Presentations published
        '400':
          description: Malformed JSON request body
        '401':
          description: Authentication required
        '403':
          description: Operation forbidden
        '422':
          description: Empty list, missing presentation, or invalid presentation
  /v0/add-templates-to-catalog:
    post:
      tags:
      - Library
      - Catalog
      summary: Add one or more templates to a catalog
      description: Adds one or more templates to a catalog by their IDs.
      operationId: add_templates_to_catalog
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddTemplatesRequest'
        required: true
      responses:
        '200':
          description: Catalog updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Catalog'
        '400':
          description: Malformed JSON request body
        '404':
          description: Catalog not found
        '422':
          description: Request body does not match the expected schema
  /v0/authorization_requests:
    get:
      tags:
      - Authorization Requests
      summary: List authorization requests
      operationId: list_authorization_requests
      responses:
        '200':
          description: Authorization requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuthorizationRequestResponse'
    post:
      tags:
      - Authorization Requests
      summary: Create an authorization request
      description: Creates and signs an OpenID authorization request. The returned form-encoded deep link can be opened by a wallet.
      operationId: create_authorization_request
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizationRequestsEndpointRequest'
        required: true
      responses:
        '201':
          description: Authorization request created
          headers:
            Location:
              schema:
                type: string
              description: Path of the created authorization request
          content:
            application/x-www-form-urlencoded:
              schema:
                type: string
        '400':
          description: Malformed JSON request body
        '422':
          description: Request body does not match the expected schema
  /v0/authorization_requests/{authorization_request_id}:
    get:
      tags:
      - Authorization Requests
      summary: Get an authorization request
      operationId: get_authorization_request
      parameters:
      - name: authorization_request_id
        in: path
        description: Authorization request ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Authorization request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationRequestResponse'
        '400':
          description: Invalid path parameter
        '404':
          description: Authorization request not found
  /v0/change-catalog-appearance:
    post:
      tags:
      - Library
      - Catalog
      summary: Changes a catalog's display information
      description: Changes a catalog's display information such as name, description, and icon.
      operationId: change_catalog_appearance
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeCatalogAppearanceRequest'
        required: true
      responses:
        '200':
          description: Catalog appearance updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Catalog'
        '400':
          description: Malformed JSON request body
        '404':
          description: Catalog not found
        '422':
          description: Request body does not match the expected schema
  /v0/configuration:
    get:
      tags:
      - Configuration
      summary: Get application configuration
      description: |-
        Returns the current application configuration. Set `provisioned=true` to return only values
        explicitly configured at startup; defaults are omitted from that response.
      operationId: get_application_configuration
      parameters:
      - name: provisioned
        in: query
        required: false
        schema:
          type:
          - boolean
          - 'null'
      responses:
        '200':
          description: Application configuration
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Invalid query parameter
  /v0/connections:
    get:
      tags:
      - Connections
      summary: List all connections
      description: List all available connections.
      operationId: get_all_connections
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GetConnectionsEndpointRequest'
        required: true
      responses:
        '200':
          description: All connections retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Connection'
        '400':
          description: Invalid query parameter
    post:
      tags:
      - Connections
      summary: Add a Connection
      description: Adds a new connection based on the provided url.
      operationId: add_connection
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddConnectionEndpointRequest'
        required: true
      responses:
        '201':
          description: Connection added successfully
          headers:
            Location:
              schema:
                type: string
