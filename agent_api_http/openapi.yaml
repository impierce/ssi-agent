openapi: 3.1.0
info:
  title: UniCore HTTP API
  description: |
    <!-- ![Banner](https://images.placeholders.dev/?width=1280&height=720) -->

    Full HTTP API reference for UniCore, an open-source SSI Agent by [Impierce Technologies B.V.](https://www.impierce.com)

    ## Overview

    ### Management endpoints

    UniCore offers a set of APIs to fulfill the requirements of all possible roles in a Self-Sovereign Identity ecosystem.

    #### Issuance

    UniCore can issue Verifiable Credentials to other entities. Credentials can be created and then offered to the recipient for acceptance.

    #### Holder

    UniCore can hold and present Verifiable Credentials to other entities. This is useful when UniCore wants to prove its own trustworthiness.

    #### Verification

    UniCore can verify Verifiable Credentials that are presented to it.

    #### Identity

    An easy way to manage UniCore's _own_ identity. Closely related to the Holder role.

    ### Standardized endpoints

    Some endpoints that UniCore offers follow a specification (such as the [OpenID4VC](https://openid.net/sg/openid4vc/specifications) protocol family). These endpoints have the **`(standardized)`** tag.

    ### Public endpoints

    Some endpoints should always be publicly accessible to allow identity wallets to interact with UniCore and follow standard protocol flows. These endpoints have the **`(public)`** tag.

    > [!NOTE]
    > Endpoints that should not sit behind some form of authentication are grouped under the `(public)` tag.

    <!-- ```json
    {
      "foo": "bar"
    }
    ``` -->

    ## Authentication & Authorization

    UniCore has no user management or authentication built in by default. The API does not check for any roles or scopes. Currently, it is expected that the application which calls UniCore only performs calls which have been checked in the consumer business logic. If you want to make your UniCore deployment reachable via the internet, you **MUST** restrict direct access to the API by running it behind a reverse proxy or some form of API gateway and check for an API key or similar. In most cases, only the endpoints behind `/v0` need to be protected and all other non-sensitive endpoints can stay publicly accessible in order for other participants (such as wallets) to interact with UniCore.

    ### Example reverse proxy configuration

    Here is an example Nginx configuration that restricts access to the `/v0` endpoints by checking for a valid API key in the headers:

    <details>
      <summary>nginx.conf</summary>

    ```
    http {
        server {
            listen 8080;
            gzip on;

            location /v0 {
                if ($http_x_api_key != "A041FE585C6F45CF841D20D47D329FA5") {
                    return 403;
                }

                proxy_pass http://127.0.0.1:3033/v0;
            }

            location / {
                proxy_pass http://127.0.0.1:3033;
            }
        }
    }
    ```

    </details>
  license:
    name: ""
  version: ""

servers:
  - url: http://localhost:3033
    description: Development

paths:
  # OpenID4VCI and Well-known endpoints (proxied)
  /.well-known/did-configuration.json:
    get:
      summary: DID configuration endpoint
      description: Returns the DID configuration for domain linkage
      tags:
        - (.well-known)
        - (public)
      responses:
        "200":
          description: DID configuration
          content:
            application/json:
              schema:
                type: object

  /.well-known/did.json:
    get:
      summary: DID document endpoint
      description: Returns the DID document for the agent
      tags:
        - (.well-known)
        - (public)
      responses:
        "200":
          description: DID document
          content:
            application/json:
              schema:
                type: object

  /.well-known/oauth-authorization-server:
    get:
      summary: Standard OpenID Connect discovery endpoint for authorization metadata
      description: Standard OpenID Connect discovery endpoint for authorization metadata
      tags:
        - (.well-known)
        - (public)
      responses:
        "200":
          description: Authorization server metadata
          content:
            application/json:
              schema:
                type: object

  /.well-known/openid-credential-issuer:
    get:
      summary: Standard OpenID Connect discovery endpoint for issuer metadata
      description: Standard OpenID Connect discovery endpoint for issuer metadata
      tags:
        - (.well-known)
        - (public)
      responses:
        "200":
          description: Credential issuer metadata
          content:
            application/json:
              schema:
                type: object

  /openid4vci/credential:
    post:
      summary: Standard OpenID Connect endpoint for redeeming a token for a credential
      description: Standard OpenID4VCI credential endpoint
      tags:
        - (public)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                credential_configuration_id:
                  type: string
                proof:
                  type: object
      responses:
        "200":
          description: Credential issued
          content:
            application/json:
              schema:
                type: object

  /openid4vci/nonce:
    post:
      summary: Request a fresh nonce for credential request proof
      description: |
        Standard OpenID4VCI nonce endpoint (Draft 15). Returns a fresh `c_nonce` that the wallet 
        must include in the proof JWT when requesting a credential. Each nonce can only be used once.
      tags:
        - (public)
      responses:
        "200":
          description: Fresh nonce generated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  c_nonce:
                    type: string
                    description: A fresh nonce value to be used in the credential request proof
                    example: "9c294e36e4231fbcf07758a71bb0b4903d7fdebf75e03a5beb7aeecf8a1b13af"
              example:
                c_nonce: "9c294e36e4231fbcf07758a71bb0b4903d7fdebf75e03a5beb7aeecf8a1b13af"

  /v0/authorization_requests:
    get:
      tags:
        - Verification
      summary: Get all authorization requests
      description: Retrieves all authorization requests
      responses:
        "200":
          description: Authorization requests retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
              examples:
                example:
                  summary: Example authorization requests
                  value:
                    - authorization_request:
                        client_id: "decentralized_identifier:did:jwk:eyJhbGciOiJFZERTQSIsImNydiI6IkVkMjU1MTkiLCJraWQiOiJ4bS1weGxpdmhRMHNaTlIwUTdfRWVGOGdyRS0xU091b2ZwN2ItYk9GTUdFIiwia3R5IjoiT0tQIiwieCI6ImhuSzJuSno0cldhck5vdlhmSmxwWEItcFhVZmJCNkxaODRzV0xOWldsNlEifQ"
                        response_uri: "http://localhost:3033/redirect"
                        state: "6bdda4c31101ed940a043ee29e22f766ed0866b911fa253468f1a5b305d2e2d5"
                        response_type: "vp_token"
                        dcql_query:
                          credentials:
                            - id: "CredentialQuery"
                              format: "jwt_vc_json"
                              meta:
                                type_values:
                                  - ["VerifiableCredential"]
                              require_cryptographic_holder_binding: true
                              claims:
                                - path: ["credentialSubject", "first_name"]
                                - path: ["credentialSubject", "last_name"]
                        response_mode: "direct_post"
                        scope: "openid"
                        nonce: "this is a nonce"
                        client_metadata:
                          client_name: "UniCore"
                          logo_uri: "https://www.impierce.com/external/impierce-icon.png"
                          vp_formats_supported:
                            jwt_vc_json:
                              alg_values: ["ES256", "EdDSA"]
                            jwt_vp_json:
                              alg_values: ["ES256", "EdDSA"]
                            dc+sd-jwt:
                              sd-jwt_alg_values: ["ES256"]
                              kb-jwt_alg_values: ["ES256"]
                          subject_syntax_types_supported:
                            - "did:jwk"
                            - "did:key"
                      form_url_encoded_authorization_request: "openid://?client_id=decentralized_identifier%3Adid%3Ajwk%3AeyJhbGciOiJFZERTQSIsImNydiI6IkVkMjU1MTkiLCJraWQiOiJ4bS1weGxpdmhRMHNaTlIwUTdfRWVGOGdyRS0xU091b2ZwN2ItYk9GTUdFIiwieCI6ImhuSzJuSno0cldhck5vdlhmSmxwWEItcFhVZmJCNkxaODRzV0xOWldsNlEifQ&request_uri=http%3A%2F%2Flocalhost%3A3033%2Frequest%2F6bdda4c31101ed940a043ee29e22f766ed0866b911fa253468f1a5b305d2e2d5"
                      signed_authorization_request_object: "..GVO-BJ0j5Ef2JLvmyx8g5sLRSrwIIFVc1EuJpHqBWO3Dt5xcniLUUrFv5598y7FctZbQKkKD6SCzJHe0t4h7Dw"
    post:
      summary: Create a new Authorization Request
      tags:
        - Verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                state:
                  type: string
                  description: A unique string representing the state of the Authorization Request
                  example: "84266fdbd31d4c2c6d0665f7e8380fa3"
                dcql_query:
                  type: object
                  description: A DCQL query object describing the Verifiable Credential(s) that will be requested
                  properties:
                    credentials:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                            example: "CredentialQuery"
                          format:
                            type: string
                            example: "jwt_vc_json"
                          meta:
                            type: object
                            properties:
                              type_values:
                                type: array
                                items:
                                  type: array
                                  items:
                                    type: string
                                example:
                                  - ["VerifiableCredential"]
                          claims:
                            type: array
                            items:
                              type: object
                              properties:
                                path:
                                  type: array
                                  items:
                                    type: string
                                  example: ["credentialSubject", "first_name"]
            examples:
              siopv2:
                summary: SIOPv2 Authorization Request
              oid4vp-with-dcql:
                summary: OID4VP with DCQL Query
                value:
                  dcql_query:
                    credentials:
                      - id: "CredentialQuery"
                        format: "jwt_vc_json"
                        meta:
                          type_values:
                            - ["VerifiableCredential"]
                        claims:
                          - path: ["credentialSubject", "first_name"]
                          - path: ["credentialSubject", "last_name"]
      responses:
        "201":
          description: An Authorization Request has successfully been created
          headers:
            Location:
              schema:
                type: string
                example: "/v0/authorization_requests/43482b98aa2e071231082fc29db7a59f342a643b0c590f71083af3c7ae83f3c3"
              description: URL of the created resource
          content:
            application/x-www-form-urlencoded:
              schema:
                type: string
                example: "openid://?client_id=did%3Ajwk%3AeyJhbGciOiJFZERTQSIsImNydiI6IkVkMjU1MTkiLCJraWQiOiJiUUtRUnphb3A3Q2dFdnFWcThVbGdMR3NkRi1SLWhuTEZrS0ZacVcyVk4wIiwia3R5IjoiT0tQIiwieCI6Ikdsbks5ZVBzODAyWHhBZ2xST1F6b0d1cm05UXB2MElGUEViZE1DSUxOX1UifQ&request_uri=http%3A%2F%2F192.168.1.127%3A3033%2Frequest%2F0fc2af709c435975ab5ebbc6dd2d5508c7f4a1cc3a59145a73a39e532bcbfdc7"

  /v0/authorization_requests/{authorization_request_id}:
    get:
      summary: Get the Authorization Request with the given Authorization Request ID
      tags:
        - Verification
      parameters:
        - in: path
          name: authorization_request_id
          required: true
          schema:
            type: string
            minimum: 1
          description: The Authorization Request ID
      responses:
        "200":
          description: An Authorization Request with the given Authorization Request ID has been successfully retrieved
          content:
            application/json:
              schema:
                type: object
              example:
                authorization_request:
                  client_id: "did:jwk:eyJhbGciOiJFZERTQSIsImNydiI6IkVkMjU1MTkiLCJraWQiOiJ4bS1weGxpdmhRMHNaTlIwUTdfRWVGOGdyRS0xU091b2ZwN2ItYk9GTUdFIiwia3R5IjoiT0tQIiwieCI6ImhuSzJuSno0cldhck5vdlhmSmxwWEItcFhVZmJCNkxaODRzV0xOWldsNlEifQ"
                  redirect_uri: "http://localhost:3033/redirect"
                  state: "f013ad664a141409b76860b825880f3b6cdaf6100ed6eb9126291865faa76af0"
                  response_type: "id_token"
                  scope: "openid"
                  response_mode: "direct_post"
                  nonce: "this is a nonce"
                  client_metadata:
                    client_name: "UniCore"
                    logo_uri: "https://www.impierce.com/external/impierce-icon.png"
                    subject_syntax_types_supported:
                      - "did:jwk"
                      - "did:key"
                    id_token_signed_response_alg: "ES256"
                    id_token_signing_alg_values_supported:
                      - "ES256"
                      - "EdDSA"
                form_url_encoded_authorization_request: "openid://?client_id=did%3Ajwk%3AeyJhbGciOiJFZERTQSIsImNydiI6IkVkMjU1MTkiLCJraWQiOiJ4bS1weGxpdmhRMHNaTlIwUTdfRWVGOGdyRS0xU091b2ZwN2ItYk9GTUdFIiwieCI6ImhuSzJuSno0cldhck5vdlhmSmxwWEItcFhVZmJCNkxaODRzV0xOWldsNlEifQ&request_uri=http%3A%2F%2Flocalhost%3A3033%2Frequest%2Ff013ad664a141409b76860b825880f3b6cdaf6100ed6eb9126291865faa76af0"
                signed_authorization_request_object: ".iMmcwZqT3iCJAy7WxqfxGSbeGoarRyK_mXqtkyO6K-gIHaeEb30HXmJhmkhbsye7BCVxlNIpkrcNMds8Ldqmaw"
                id_token: null
                vp_token: null
                state: null
        "404":
          description: Authorization Request not found

  # Issuance endpoints
  /v0/credential-configurations:
    post:
      tags:
        - Issuance
      summary: Create a new Credential Configuration
      description: Creates a new credential configuration for the issuer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                credential_configuration_id:
                  type: string
                  example: w3c_vc_credential
                format:
                  type: string
                  example: jwt_vc_json
                type:
                  type: array
                  items:
                    type: string
                    example: VerifiableCredential
                  example:
                    - VerifiableCredential
                display:
                  type: array
                  items:
                    type: object
                    properties:
                      locale:
                        type: string
                        example: en
                      logo:
                        type: object
                        properties:
                          alt_text:
                            type: string
                            example: UniCore Logo
                          uri:
                            type: string
                            example: https://impierce.com/images/logo-blue.png
                      name:
                        type: string
                        example: Identity Credential
                  example:
                    - locale: en
                      logo:
                        alt_text: UniCore Logo
                        uri: https://impierce.com/images/logo-blue.png
                      name: Identity Credential
              required:
                - credential_configuration_id
                - format
                - credential_definition
            examples:
              jwt_vc_json_vc1_1_credential_configurations:
                summary: JwtVcJson VC DM V1.1
                value:
                  credential_configuration_id: jwt_vc_json_vc1_1_credential
                  type:
                    - VerifiableCredential
                  display:
                    - locale: en
                      logo:
                        alt_text: UniCore Logo
                        uri: https://impierce.com/images/logo-blue.png
                      name: Identity Credential
                  format: jwt_vc_json
              jwt_vc_json_obv3_credential_configurations:
                summary: JwtVcJson Open Badges V3.0
                value:
                  credential_configuration_id: jwt_vc_json_obv3_credential
                  type:
                    - VerifiableCredential
                    - OpenBadgeCredential
                  display:
                    - locale: en
                      logo:
                        alt_text: UniCore Logo
                        uri: https://impierce.com/images/logo-blue.png
                      name: Identity Credential
                  format: jwt_vc_json
              jwt_vc_json_elm_credential_configurations:
                summary: JwtVcJson European Digital Credental V3.3
                value:
                  credential_configuration_id: jwt_vc_json_elm_credential
                  type:
                    - VerifiableCredential
                    - EuropeanDigitalCredential
                  display:
                    - locale: en
                      logo:
                        alt_text: UniCore Logo
                        uri: https://impierce.com/images/logo-blue.png
                      name: Identity Credential
                  format: jwt_vc_json
              dc+sd-jwt_credential_configurations:
                summary: SD-JWT VC
                value:
                  credential_configuration_id: dc+sd-jwt
                  display:
                    - locale: en
                      logo:
                        alt_text: UniCore Logo
                        uri: https://impierce.com/images/logo-blue.png
                      name: Identity Credential
                  format: dc+sd-jwt
              vcdm2_sd_jwt_credential_configurations:
                summary: VC DM V2.0 SD-JWT
                value:
                  credential_configuration_id: vc2_vc+sd-jwt
                  type:
                    - VerifiableCredential
                  display:
                    - locale: en
                      logo:
                        alt_text: UniCore Logo
                        uri: https://impierce.com/images/logo-blue.png
                      name: Identity Credential
                  format: vc+sd-jwt
              obv3_sd_jwt_credential_configurations:
                summary: Open Badges V3.0 SD-JWT
                value:
                  credential_configuration_id: obv3_vc+sd-jwt
                  type:
                    - VerifiableCredential
                    - OpenBadgeCredential
                  display:
                    - locale: en
                      logo:
                        alt_text: UniCore Logo
                        uri: https://impierce.com/images/logo-blue.png
                      name: Identity Credential
                  format: vc+sd-jwt
              elm_sd_jwt_credential_configurations:
                summary: European Digital Credential V3.3 SD-JWT
                value:
                  credential_configuration_id: elm_vc+sd-jwt
                  type:
                    - VerifiableCredential
                    - EuropeanDigitalCredential
                  display:
                    - locale: en
                      logo:
                        alt_text: UniCore Logo
                        uri: https://impierce.com/images/logo-blue.png
                      name: Identity Credential
                  format: vc+sd-jwt
      responses:
        "200":
          description: A Credential Configuration has been successfully added to the Credential Issuer Metadata

  /v0/credentials:
    get:
      tags:
        - Issuance
      summary: Get all credentials
      description: Retrieves all credentials created by the issuer
      responses:
        "200":
          description: Credentials retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
              examples:
                credentials-list:
                  summary: Example credentials list
                  value:
                    - id: "e64008ce-1dc6-42ee-8ba1-162bb617fb38"
                      notification_id: "f040d1cc669f7e45518500a59774faa2888af93c65a9dffb0c5e706b5e33c0fd"
                      data:
                        raw:
                          "@context":
                            - "https://www.w3.org/2018/credentials/v1"
                          type:
                            - "VerifiableCredential"
                          credentialSubject:
                            dob: "1982-01-01"
                            first_name: "Ferris"
                            last_name: "Crabman"
                          issuer:
                            id: "http://localhost:3033/"
                            name: "UniCore"
                          issuanceDate: "2025-10-24T09:36:01Z"
                          expirationDate: "3025-10-24T11:34:00Z"
                          credentialStatus:
                            id: "http://localhost:3033/ietf-oauth-token-status-list/0"
                            type: "statuslist+jwt"
                            idx: 1883
                            uri: "http://localhost:3033/ietf-oauth-token-status-list/0"
                      credential_configuration:
                        format: "jwt_vc_json"
                        credential_definition:
                          type:
                            - "VerifiableCredential"
                        cryptographic_binding_methods_supported:
                          - "did:jwk"
                          - "did:key"
                        credential_signing_alg_values_supported:
                          - "ES256"
                          - "EdDSA"
                        proof_types_supported:
                          jwt:
                            proof_signing_alg_values_supported:
                              - "ES256"
                              - "EdDSA"
                        display:
                          - name: "Identity Credential"
                            locale: "en"
                            logo:
                              uri: "https://impierce.com/images/logo-blue.png"
                              alt_text: "UniCore Logo"
                      signed: null
                      status: "Pending"
                      holder_notifications: []
                      credential_status:
                        index: 1883
                        status: "VALID"
    post:
      summary: Create a new Credential for a given Subject
      tags:
        - Issuance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                offerId:
                  type: string
                  description: The offer ID associated with this credential
                credentialConfigurationId:
                  type: string
                  description: The credential configuration to use
                credential:
                  description: The credential data (can be an object or a signed string)
                  oneOf:
                    - type: object
                      properties:
                        credentialSubject:
                          type: object
                    - type: string
                isSigned:
                  type: boolean
                  default: false
                  description: Whether the credential is already signed
                expiresAt:
                  type: object
                  description: Credential expiration settings
              required:
                - offerId
                - credentialConfigurationId
                - credential
                - expiresAt
            examples:
              jwt_vc_json_vc1_1:
                summary: JwtVcJson VC Data Model V1.1
                value:
                  credential:
                    credentialSubject:
                      dob: "1982-01-01"
                      first_name: Ferris
                      last_name: Crabman
                  credentialConfigurationId: jwt_vc_json_vc1_1_credential
                  offerId: "001"
                  expiresAt: "3025-10-24 11:34:00Z"
              jwt_vc_json_obv3:
                summary: JwtVcJson Open Badges V3.0
                value:
                  credential:
                    id: https://example.com/badges/teamwork
                    credentialSubject:
                      achievement:
                        criteria:
                          narrative: Team members are nominated for this badge by their peers and recognized upon review by Example Corp management.
                        description: This badge recognizes the development of the capacity to collaborate within a group environment.
                        id: https://example.com/achievements/21st-century-skills/teamwork
                        name: Teamwork
                        type: Achievement
                      type:
                        - AchievementSubject
                  credentialConfigurationId: jwt_vc_json_obv3_credential
                  offerId: "001"
                  expiresAt: "3025-10-24 11:34:00Z"
              jwt_vc_json_elm:
                summary: JwtVcJson European Digital Credential V3.3
                value:
                  credential:
                    credentialSubject:
                      dob: "1982-01-01"
                      first_name: Ferris
                      last_name: Crabman
                  credentialConfigurationId: jwt_vc_json_elm_credential
                  offerId: "001"
                  expiresAt: "3025-10-24 11:34:00Z"
              dc+sd-jwt:
                summary: SD-JWT VC
                value:
                  credential:
                    dob: "1982-01-01"
                    first_name: Ferris
                    last_name: Crabman
                  credentialConfigurationId: dc+sd-jwt
                  offerId: "001"
                  expiresAt: "3025-10-24 11:34:00Z"
              vcdm2-sd-jwt:
                summary: VC DM V2.0 SD-JWT
                value:
                  credential:
                    credentialSubject:
                      dob: "1982-01-01"
                      first_name: Ferris
                      last_name: Crabman
                  credentialConfigurationId: vc2_vc+sd-jwt
                  offerId: "001"
                  expiresAt: "3025-10-24 11:34:00Z"
              obv3-sd-jwt:
                summary: Open Badges V3.0 SD-JWT
                value:
                  credential:
                    credentialSubject:
                      dob: "1982-01-01"
                      first_name: Ferris
                      last_name: Crabman
                  credentialConfigurationId: obv3_vc+sd-jwt
                  offerId: "001"
                  expiresAt: "3025-10-24 11:34:00Z"
              elm-sd-jwt:
                summary: European Digital Credential V3.3 SD-JWT
                value:
                  credential:
                    credentialSubject:
                      dob: "1982-01-01"
                      first_name: Ferris
                      last_name: Crabman
                  credentialConfigurationId: elm_vc+sd-jwt
                  offerId: "001"
                  expiresAt: "3025-10-24 11:34:00Z"
      responses:
        "201":
          description: Credential successfully created
          headers:
            Location:
              schema:
                type: string
                example: "/v0/credentials/c0c97176-44c3-4f22-ab11-6bb782e29cb9"
              description: URL of the created resource
          content:
            application/json:
