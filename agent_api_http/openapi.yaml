            application/json:
              schema:
                type: object
        "404":
          description: Offer not found

  /v0/offers/send-offer-to-individual:
    post:
      summary: Send an offer to an individual
      description: Send a credential offer to an individual recipient via email.
      tags:
        - Issuance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                offerId:
                  type: string
                  description: Unique identifier for the offer
                  example: "c86289fa-b105-4ec3-9326-a02436788f11"
                recipientEmail:
                  type: string
                  format: email
                  description: The email address of the individual recipient
                  example: "email@example.test"
              required:
                - offerId
                - recipientEmail
      responses:
        "200":
          description: Offer sent successfully to individual

  /v0/offers/send-offer-to-organization:
    post:
